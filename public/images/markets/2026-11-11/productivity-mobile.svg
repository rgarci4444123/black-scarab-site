<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 210" width="256" height="210" role="img" aria-labelledby="title desc"><title id="title">U.S. productivity growth</title><desc id="desc">Third-quarter 2026 preliminary output-per-hour growth: nonfarm business 3.6%, manufacturing 0.3%. Both seasonally adjusted annualized rates; sector output definitions differ.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="0" y="25" fill="#24272c" font-size="16" text-anchor="start" font-weight="400">Nonfarm business</text><text x="256" y="29" fill="#128db6" font-size="25" text-anchor="end" font-weight="500">+3.6%</text><rect x="0" y="55" width="256" height="7" rx="3.5" fill="#edf0f3"/><rect x="0" y="55" width="230.40" height="7" rx="3.5" fill="#128db6"/><text x="0" y="124" fill="#24272c" font-size="16" text-anchor="start" font-weight="400">Manufacturing</text><text x="256" y="128" fill="#128db6" font-size="25" text-anchor="end" font-weight="500">+0.3%</text><rect x="0" y="154" width="256" height="7" rx="3.5" fill="#edf0f3"/><rect x="0" y="154" width="19.20" height="7" rx="3.5" fill="#128db6"/></g></svg>