<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 205" width="600" height="205" role="img" aria-labelledby="title desc"><title id="title">Cognex operating margin</title><desc id="desc">GAAP operating margin rose from 20.9% in Q3 2025 to 32.2% in Q3 2026, an increase of 11.3 percentage points. Thin tracks show a 0–100% scale.</desc><g font-family="Arial, Helvetica, sans-serif"><line x1="300.0" y1="0" x2="300.0" y2="172" stroke="#edf0f3"/><text x="30.0" y="24" fill="#818891" font-size="14" text-anchor="start" font-weight="400">Q3 2025</text><text x="30.0" y="108" fill="#8c939b" font-size="63" text-anchor="start" font-weight="500">20.9%</text><rect x="30.0" y="139" width="240.0" height="5" rx="2.5" fill="#edf0f3"/><rect x="30.0" y="139" width="50.16" height="5" rx="2.5" fill="#8c939b"/><text x="330.0" y="24" fill="#818891" font-size="14" text-anchor="start" font-weight="400">Q3 2026</text><text x="330.0" y="108" fill="#128db6" font-size="63" text-anchor="start" font-weight="500">32.2%</text><rect x="330.0" y="139" width="240.0" height="5" rx="2.5" fill="#edf0f3"/><rect x="330.0" y="139" width="77.28" height="5" rx="2.5" fill="#128db6"/><text x="300.0" y="199" fill="#128db6" font-size="15" text-anchor="middle" font-weight="500">+11.3 percentage points</text></g></svg>