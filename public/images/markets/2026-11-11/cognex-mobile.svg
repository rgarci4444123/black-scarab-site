<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 192" width="256" height="192" role="img" aria-labelledby="title desc"><title id="title">Cognex operating margin</title><desc id="desc">GAAP operating margin rose from 20.9% in Q3 2025 to 32.2% in Q3 2026, an increase of 11.3 percentage points. Thin tracks show a 0–100% scale.</desc><g font-family="Arial, Helvetica, sans-serif"><line x1="128.0" y1="0" x2="128.0" y2="159" stroke="#edf0f3"/><text x="16.0" y="24" fill="#818891" font-size="15" text-anchor="start" font-weight="400">Q3 2025</text><text x="16.0" y="94" fill="#8c939b" font-size="36" text-anchor="start" font-weight="500">20.9%</text><rect x="16.0" y="122" width="96.0" height="5" rx="2.5" fill="#edf0f3"/><rect x="16.0" y="122" width="20.06" height="5" rx="2.5" fill="#8c939b"/><text x="144.0" y="24" fill="#818891" font-size="15" text-anchor="start" font-weight="400">Q3 2026</text><text x="144.0" y="94" fill="#128db6" font-size="36" text-anchor="start" font-weight="500">32.2%</text><rect x="144.0" y="122" width="96.0" height="5" rx="2.5" fill="#edf0f3"/><rect x="144.0" y="122" width="30.91" height="5" rx="2.5" fill="#128db6"/><text x="128.0" y="186" fill="#128db6" font-size="14" text-anchor="middle" font-weight="500">+11.3 percentage points</text></g></svg>