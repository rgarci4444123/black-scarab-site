<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 248" width="600" height="248" role="img" aria-labelledby="title desc"><title id="title">Siemens Digital Industries profit margin</title><desc id="desc">Comparable fiscal fourth quarters. Reported profit margin: FY2025 15.5%, FY2026 20.9%. Excluding severance: FY2025 19.9%, FY2026 21.9%. Thin tracks use the same zero to twenty-five percent scale.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><text x="304" y="20" fill="#7b848e" font-size="14" text-anchor="middle" font-weight="400">FY2025</text><text x="514" y="20" fill="#7b848e" font-size="14" text-anchor="middle" font-weight="400">FY2026</text><text x="0" y="81" fill="#252a30" font-size="17" text-anchor="start" font-weight="400">Reported</text><text x="304" y="86" fill="#aab4be" font-size="43" text-anchor="middle" font-weight="500">15.5%</text><rect x="229.0" y="108" width="150" height="4" rx="2" fill="#edf0f3"/><rect x="229.0" y="108" width="93.0" height="4" rx="2" fill="#aab4be"/><text x="514" y="86" fill="#168db8" font-size="43" text-anchor="middle" font-weight="500">20.9%</text><rect x="439.0" y="108" width="150" height="4" rx="2" fill="#edf0f3"/><rect x="439.0" y="108" width="125.4" height="4" rx="2" fill="#168db8"/><line x1="0" y1="135" x2="600" y2="135" stroke="#edf0f3" stroke-width="1"/><text x="0" y="194" fill="#252a30" font-size="17" text-anchor="start" font-weight="400">Excluding severance</text><text x="304" y="199" fill="#aab4be" font-size="43" text-anchor="middle" font-weight="500">19.9%</text><rect x="229.0" y="221" width="150" height="4" rx="2" fill="#edf0f3"/><rect x="229.0" y="221" width="119.4" height="4" rx="2" fill="#aab4be"/><text x="514" y="199" fill="#bd6c8b" font-size="43" text-anchor="middle" font-weight="500">21.9%</text><rect x="439.0" y="221" width="150" height="4" rx="2" fill="#edf0f3"/><rect x="439.0" y="221" width="131.4" height="4" rx="2" fill="#bd6c8b"/></g></svg>