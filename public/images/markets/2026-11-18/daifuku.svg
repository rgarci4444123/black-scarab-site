<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="title desc"><title id="title">Daifuku nine-month growth</title><desc id="desc">January to September 2026 year-over-year growth: orders 56.5%, sales 13.9%, operating profit 11.0%. Calculated operating margin decreased from 15.5% to 15.1%. Orders, sales and operating profit are distinct measures, not a conversion funnel.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><line x1="0" y1="224.0" x2="600" y2="224.0" stroke="#edf0f3" stroke-width="1"/><text x="0" y="216.0" fill="#7b848e" font-size="12" text-anchor="start" font-weight="400">0%</text><line x1="0" y1="140.0" x2="600" y2="140.0" stroke="#edf0f3" stroke-width="1"/><text x="0" y="132.0" fill="#7b848e" font-size="12" text-anchor="start" font-weight="400">30%</text><line x1="0" y1="56.0" x2="600" y2="56.0" stroke="#edf0f3" stroke-width="1"/><text x="0" y="48.0" fill="#7b848e" font-size="12" text-anchor="start" font-weight="400">60%</text><rect x="60.0" y="65.8" width="88" height="158.2" rx="5" fill="#168db8"/><text x="104" y="50.80000000000001" fill="#168db8" font-size="32" text-anchor="middle" font-weight="500">+56.5%</text><text x="104" y="257" fill="#252a30" font-size="17" text-anchor="middle" font-weight="400">Orders</text><rect x="256.0" y="185.08" width="88" height="38.92" rx="5" fill="#aab4be"/><text x="300" y="170.07999999999998" fill="#252a30" font-size="32" text-anchor="middle" font-weight="500">+13.9%</text><text x="300" y="257" fill="#252a30" font-size="17" text-anchor="middle" font-weight="400">Sales</text><rect x="452.0" y="193.2" width="88" height="30.8" rx="5" fill="#bd6c8b"/><text x="496" y="178.2" fill="#bd6c8b" font-size="32" text-anchor="middle" font-weight="500">+11.0%</text><text x="496" y="257" fill="#252a30" font-size="17" text-anchor="middle" font-weight="400">Operating</text><text x="496" y="278" fill="#252a30" font-size="17" text-anchor="middle" font-weight="400">profit</text><line x1="0" y1="299" x2="600" y2="299" stroke="#edf0f3" stroke-width="1"/><text x="0" y="338" fill="#7b848e" font-size="15" text-anchor="start" font-weight="400">Operating margin</text><text x="600" y="338" fill="#bd6c8b" font-size="23" text-anchor="end" font-weight="500">15.5% → 15.1%</text></g></svg>