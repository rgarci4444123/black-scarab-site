<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 340" width="256" height="340" role="img" aria-labelledby="title desc"><title id="title">Daifuku nine-month growth</title><desc id="desc">January to September 2026 year-over-year growth: orders 56.5%, sales 13.9%, operating profit 11.0%. Calculated operating margin decreased from 15.5% to 15.1%. Orders, sales and operating profit are distinct measures, not a conversion funnel.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><line x1="0" y1="224.0" x2="256" y2="224.0" stroke="#edf0f3" stroke-width="1"/><line x1="0" y1="140.0" x2="256" y2="140.0" stroke="#edf0f3" stroke-width="1"/><line x1="0" y1="56.0" x2="256" y2="56.0" stroke="#edf0f3" stroke-width="1"/><rect x="21.0" y="65.8" width="46" height="158.2" rx="5" fill="#168db8"/><text x="44" y="50.80000000000001" fill="#168db8" font-size="22" text-anchor="middle" font-weight="500">+56.5%</text><text x="44" y="257" fill="#252a30" font-size="15" text-anchor="middle" font-weight="400">Orders</text><rect x="105.0" y="185.08" width="46" height="38.92" rx="5" fill="#aab4be"/><text x="128" y="170.07999999999998" fill="#252a30" font-size="22" text-anchor="middle" font-weight="500">+13.9%</text><text x="128" y="257" fill="#252a30" font-size="15" text-anchor="middle" font-weight="400">Sales</text><rect x="189.0" y="193.2" width="46" height="30.8" rx="5" fill="#bd6c8b"/><text x="212" y="178.2" fill="#bd6c8b" font-size="22" text-anchor="middle" font-weight="500">+11.0%</text><text x="212" y="257" fill="#252a30" font-size="15" text-anchor="middle" font-weight="400">Operating</text><text x="212" y="278" fill="#252a30" font-size="15" text-anchor="middle" font-weight="400">profit</text><line x1="0" y1="299" x2="256" y2="299" stroke="#edf0f3" stroke-width="1"/><text x="0" y="328" fill="#7b848e" font-size="13" text-anchor="start" font-weight="400">Operating margin</text><text x="256" y="328" fill="#bd6c8b" font-size="17" text-anchor="end" font-weight="500">15.5% → 15.1%</text></g></svg>