<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 265" width="256" height="265" role="img" aria-labelledby="title desc"><title id="title">Siemens Digital Industries profit margin</title><desc id="desc">Comparable fiscal fourth quarters. Reported profit margin: FY2025 15.5%, FY2026 20.9%. Excluding severance: FY2025 19.9%, FY2026 21.9%. Thin tracks use the same zero to twenty-five percent scale.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><text x="64" y="20" fill="#7b848e" font-size="14" text-anchor="middle" font-weight="400">FY2025</text><text x="198" y="20" fill="#7b848e" font-size="14" text-anchor="middle" font-weight="400">FY2026</text><text x="0" y="59" fill="#252a30" font-size="16" text-anchor="start" font-weight="400">Reported</text><text x="64" y="102" fill="#aab4be" font-size="34" text-anchor="middle" font-weight="500">15.5%</text><rect x="11.0" y="121" width="106" height="4" rx="2" fill="#edf0f3"/><rect x="11.0" y="121" width="65.72" height="4" rx="2" fill="#aab4be"/><text x="198" y="102" fill="#168db8" font-size="34" text-anchor="middle" font-weight="500">20.9%</text><rect x="145.0" y="121" width="106" height="4" rx="2" fill="#edf0f3"/><rect x="145.0" y="121" width="88.61599999999999" height="4" rx="2" fill="#168db8"/><line x1="0" y1="139" x2="256" y2="139" stroke="#edf0f3" stroke-width="1"/><text x="0" y="178" fill="#252a30" font-size="16" text-anchor="start" font-weight="400">Excluding severance</text><text x="64" y="221" fill="#aab4be" font-size="34" text-anchor="middle" font-weight="500">19.9%</text><rect x="11.0" y="240" width="106" height="4" rx="2" fill="#edf0f3"/><rect x="11.0" y="240" width="84.37599999999999" height="4" rx="2" fill="#aab4be"/><text x="198" y="221" fill="#bd6c8b" font-size="34" text-anchor="middle" font-weight="500">21.9%</text><rect x="145.0" y="240" width="106" height="4" rx="2" fill="#edf0f3"/><rect x="145.0" y="240" width="92.85599999999998" height="4" rx="2" fill="#bd6c8b"/></g></svg>