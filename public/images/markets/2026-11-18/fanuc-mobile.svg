<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 260" width="256" height="260" role="img" aria-labelledby="title desc"><title id="title">FANUC production constraint</title><desc id="desc">FANUC says installed factory capacity can meet current demand, but stable component procurement is the primary constraint on production. Capacity and parts availability both feed equipment deliveries. Qualitative management assessment, not a quantified causal model.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0.5" y="0.5" width="117" height="122" rx="14" fill="#ffffff" stroke="#e6eaee"/><text x="14" y="28" fill="#7b848e" font-size="15" text-anchor="start" font-weight="400">Factory</text><text x="14" y="48" fill="#7b848e" font-size="15" text-anchor="start" font-weight="400">capacity</text><text x="14" y="92" fill="#168db8" font-size="20" text-anchor="start" font-weight="500">Available</text><rect x="138.5" y="0.5" width="117" height="122" rx="14" fill="#ffffff" stroke="#ead4dd"/><text x="152" y="28" fill="#7b848e" font-size="15" text-anchor="start" font-weight="400">Component</text><text x="152" y="48" fill="#7b848e" font-size="15" text-anchor="start" font-weight="400">supply</text><text x="152" y="92" fill="#bd6c8b" font-size="17" text-anchor="start" font-weight="500">Constrained</text><path d="M 59.0 122 V 171 H 128.0" stroke="#aab4be" stroke-width="1.4" fill="none"/><path d="M 197.0 122 V 171 H 128.0" stroke="#bd6c8b" stroke-width="1.4" fill="none"/><line x1="128.0" y1="171" x2="128.0" y2="198" stroke="#168db8" stroke-width="1.4"/><path d="M124.0 193 l4 5 4 -5" fill="none" stroke="#168db8" stroke-width="1.4"/><rect x="13.0" y="211" width="230" height="46" rx="11" fill="#f7fafc"/><text x="128.0" y="240" fill="#252a30" font-size="18" text-anchor="middle" font-weight="500">Equipment deliveries</text></g></svg>