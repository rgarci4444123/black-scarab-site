<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-labelledby="title desc"><title id="title">FANUC production constraint</title><desc id="desc">FANUC says installed factory capacity can meet current demand, but stable component procurement is the primary constraint on production. Capacity and parts availability both feed equipment deliveries. Qualitative management assessment, not a quantified causal model.</desc><g font-family="Arial, Helvetica, sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0.5" y="0.5" width="249" height="122" rx="14" fill="#ffffff" stroke="#e6eaee"/><text x="22" y="34" fill="#7b848e" font-size="16" text-anchor="start" font-weight="400">Factory capacity</text><text x="22" y="86" fill="#168db8" font-size="31" text-anchor="start" font-weight="500">Available</text><rect x="350.5" y="0.5" width="249" height="122" rx="14" fill="#ffffff" stroke="#ead4dd"/><text x="372" y="34" fill="#7b848e" font-size="16" text-anchor="start" font-weight="400">Component supply</text><text x="372" y="86" fill="#bd6c8b" font-size="31" text-anchor="start" font-weight="500">Constrained</text><path d="M 125.0 122 V 171 H 300.0" stroke="#aab4be" stroke-width="1.4" fill="none"/><path d="M 475.0 122 V 171 H 300.0" stroke="#bd6c8b" stroke-width="1.4" fill="none"/><line x1="300.0" y1="171" x2="300.0" y2="198" stroke="#168db8" stroke-width="1.4"/><path d="M296.0 193 l4 5 4 -5" fill="none" stroke="#168db8" stroke-width="1.4"/><rect x="155.0" y="211" width="290" height="46" rx="11" fill="#f7fafc"/><text x="300.0" y="240" fill="#252a30" font-size="21" text-anchor="middle" font-weight="500">Equipment deliveries</text></g></svg>