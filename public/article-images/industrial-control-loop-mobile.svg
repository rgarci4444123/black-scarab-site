<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Industrial control loop</title><desc id="desc">Vertical mobile diagram of command, controller, drive, actuator, process, sensor feedback, and safety control.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#667268"/></marker><style>.t{font:700 42px Georgia,serif;fill:#242722}.e{font:600 16px Arial;letter-spacing:2px;fill:#798078}.l{font:700 25px Arial;fill:#252824}.b{font:400 18px Arial;fill:#555b55}.light{fill:#f7f2e8}.lightBody{fill:#d9ddd8}.x{fill:#fbf8ef;stroke:#939f94;stroke-width:2}.s{fill:#dfe7dd;stroke:#758276;stroke-width:2}.d{fill:#2d322e}.ln{stroke:#667268;stroke-width:4;fill:none;marker-end:url(#a)}.sf{stroke:#a96a42;stroke-width:4;stroke-dasharray:11 9;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="900" height="1500" fill="#f3efe4"/><text x="60" y="72" class="e">INSIDE THE PHYSICAL AI FACTORY</text><text x="60" y="130" class="t">The control loop</text><text x="60" y="168" class="b">Feedback proves what the command achieved.</text>
  <g text-anchor="middle"><rect x="180" y="230" width="540" height="125" rx="18" class="x"/><text x="450" y="278" class="l">Command</text><text x="450" y="315" class="b">Set point · recipe · cycle request</text>
  <rect x="180" y="405" width="540" height="125" rx="18" class="s"/><text x="450" y="453" class="l">Controller</text><text x="450" y="490" class="b">Read state · compare · decide</text>
  <rect x="180" y="580" width="540" height="125" rx="18" class="x"/><text x="450" y="628" class="l">Drive and actuator</text><text x="450" y="665" class="b">Regulate power · create physical action</text>
  <rect x="180" y="755" width="540" height="125" rx="18" class="d"/><text x="450" y="803" class="l light">Physical process</text><text x="450" y="840" class="b lightBody">Move · hold · transform · inspect</text>
  <rect x="180" y="1000" width="540" height="125" rx="18" class="s"/><text x="450" y="1048" class="l">Sensor and feedback</text><text x="450" y="1085" class="b">Measure actual state · return evidence</text></g>
  <path d="M450 355V395M450 530V570M450 705V745M450 880V990" class="ln"/><path d="M180 1065H115V470H170" class="ln"/>
  <rect x="180" y="1240" width="540" height="125" rx="18" fill="#f2ddcf" stroke="#a96a42" stroke-width="2"/><text x="450" y="1288" text-anchor="middle" class="l">Safety control</text><text x="450" y="1325" text-anchor="middle" class="b">Independent path to a defined safe response</text><path d="M450 1240V1135" class="sf"/>
  <text x="60" y="1440" class="b">Command, feedback, fault response, and safety are all designed.</text>
</svg>
