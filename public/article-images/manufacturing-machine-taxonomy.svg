<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing machine atlas</title>
  <desc id="desc">Ten machine actions organized around how they change or handle material.</desc>
  <rect width="1200" height="720" rx="32" fill="#f3efe4"/>
  <text x="64" y="76" fill="#292d28" font-family="Georgia, serif" font-size="38" font-weight="700">Start with the action</text>
  <text x="64" y="112" fill="#687066" font-family="Arial, sans-serif" font-size="17">Machine names multiply. The physical actions stay understandable.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 158)">
      <rect width="336" height="218" rx="22" fill="#30352f"/>
      <text x="26" y="38" fill="#c6d0bc" font-size="13" letter-spacing="2">SHAPE MATERIAL</text>
      <g font-size="18" fill="#f8f5ec">
        <circle cx="42" cy="82" r="13" fill="#9eaa95"/><text x="70" y="88">Remove</text>
        <circle cx="42" cy="126" r="13" fill="#9eaa95"/><text x="70" y="132">Separate</text>
        <circle cx="42" cy="170" r="13" fill="#9eaa95"/><text x="70" y="176">Form</text>
      </g>
    </g>
    <g transform="translate(432 158)">
      <rect width="336" height="218" rx="22" fill="#dfe3d5" stroke="#9ca796" stroke-width="2"/>
      <text x="26" y="38" fill="#566057" font-size="13" letter-spacing="2">CREATE MATERIAL FORM</text>
      <g font-size="18" fill="#292d28">
        <circle cx="42" cy="82" r="13" fill="#8f9c86"/><text x="70" y="88">Add</text>
        <circle cx="42" cy="126" r="13" fill="#8f9c86"/><text x="70" y="132">Mold</text>
        <circle cx="42" cy="170" r="13" fill="#8f9c86"/><text x="70" y="176">Cast</text>
      </g>
    </g>
    <g transform="translate(800 158)">
      <rect width="336" height="218" rx="22" fill="#e2d8c2" stroke="#b7aa8e" stroke-width="2"/>
      <text x="26" y="38" fill="#625d52" font-size="13" letter-spacing="2">BUILD THE PRODUCT</text>
      <g font-size="18" fill="#292d28">
        <circle cx="42" cy="82" r="13" fill="#a99b7d"/><text x="70" y="88">Join</text>
        <circle cx="42" cy="126" r="13" fill="#a99b7d"/><text x="70" y="132">Assemble</text>
        <circle cx="42" cy="170" r="13" fill="#a99b7d"/><text x="70" y="176">Inspect</text>
      </g>
    </g>
    <path d="M232 396v42h736v-42" fill="none" stroke="#8e978c" stroke-width="2"/>
    <path d="M600 438v42" stroke="#8e978c" stroke-width="2"/>
    <g transform="translate(310 480)">
      <rect width="580" height="132" rx="22" fill="#fbf8f0" stroke="#a4ad9e" stroke-width="2"/>
      <text x="290" y="38" text-anchor="middle" fill="#566057" font-size="13" letter-spacing="2">SUPPORT THE FLOW</text>
      <text x="290" y="80" text-anchor="middle" fill="#292d28" font-family="Georgia, serif" font-size="28" font-weight="700">Move and package</text>
      <text x="290" y="108" text-anchor="middle" fill="#687066" font-size="16">Between every process and into the customer shipment</text>
    </g>
  </g>
  <text x="64" y="678" fill="#687066" font-family="Arial, sans-serif" font-size="13">BLACK SCARAB • INSIDE THE PHYSICAL AI FACTORY</text>
</svg>
