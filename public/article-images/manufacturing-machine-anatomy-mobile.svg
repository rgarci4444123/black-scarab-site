<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of a complete machine application</title>
  <desc id="desc">A clear diagram separates the machine core from tooling, workholding, control, utilities, safety, and measurement.</desc>
  <rect width="720" height="1080" rx="30" fill="#f3efe4"/>
  <text x="42" y="64" fill="#292d28" font-family="Georgia, serif" font-size="31" font-weight="700">The complete machine</text>
  <text x="42" y="98" fill="#687066" font-family="Arial, sans-serif" font-size="16">Every element must connect into one application.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(42 138)">
      <rect width="636" height="230" rx="24" fill="#30352f"/>
      <rect x="236" y="34" width="164" height="112" rx="16" fill="#f4f0e5" stroke="#9eaa95" stroke-width="3"/>
      <path d="M318 34v34" stroke="#8f9c86" stroke-width="11" stroke-linecap="round"/>
      <path d="M318 68v32" stroke="#d0b982" stroke-width="7" stroke-linecap="round"/>
      <rect x="272" y="101" width="92" height="24" rx="5" fill="#a9b39f"/>
      <text x="318" y="182" text-anchor="middle" fill="#c6d0bc" font-size="18" letter-spacing="2">MACHINE CORE</text>
      <text x="318" y="208" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="20" font-weight="700">Structure • motion • power</text>
    </g>
    <g transform="translate(42 400)">
      <g fill="#fbf8f0" stroke="#a4ad9e" stroke-width="2">
        <rect width="300" height="130" rx="18"/><rect x="336" width="300" height="130" rx="18"/>
        <rect y="158" width="300" height="130" rx="18"/><rect x="336" y="158" width="300" height="130" rx="18"/>
        <rect y="316" width="300" height="130" rx="18"/><rect x="336" y="316" width="300" height="130" rx="18"/>
      </g>
      <g fill="#292d28">
        <text x="24" y="42" font-family="Georgia, serif" font-size="24" font-weight="700">Tooling</text><text x="24" y="72" fill="#687066" font-size="20">Touches the material</text><text x="24" y="102" fill="#687066" font-size="20">Wears and changes</text>
        <text x="360" y="42" font-family="Georgia, serif" font-size="24" font-weight="700">Workholding</text><text x="360" y="72" fill="#687066" font-size="20">Locates the part</text><text x="360" y="102" fill="#687066" font-size="20">Restrains the force</text>
        <text x="24" y="200" font-family="Georgia, serif" font-size="24" font-weight="700">Material flow</text><text x="24" y="230" fill="#687066" font-size="20">Loads and unloads</text><text x="24" y="260" fill="#687066" font-size="20">Carries waste away</text>
        <text x="360" y="200" font-family="Georgia, serif" font-size="24" font-weight="700">Control</text><text x="360" y="230" fill="#687066" font-size="20">Commands the action</text><text x="360" y="260" fill="#687066" font-size="20">Keeps the revision</text>
        <text x="24" y="358" font-family="Georgia, serif" font-size="24" font-weight="700">Utilities and safety</text><text x="24" y="388" fill="#687066" font-size="20">Enable and contain</text><text x="24" y="418" fill="#687066" font-size="20">Protect every mode</text>
        <text x="360" y="358" font-family="Georgia, serif" font-size="24" font-weight="700">Measurement</text><text x="360" y="388" fill="#687066" font-size="20">Proves the result</text><text x="360" y="418" fill="#687066" font-size="20">Preserves evidence</text>
      </g>
    </g>
    <g transform="translate(42 884)">
      <rect width="636" height="116" rx="20" fill="#dfe3d5" stroke="#9ca796" stroke-width="2"/>
      <text x="318" y="40" text-anchor="middle" fill="#566057" font-size="18" letter-spacing="2">THE REAL OUTPUT</text>
      <text x="318" y="72" text-anchor="middle" fill="#292d28" font-size="18">Part • evidence • waste</text>
      <text x="318" y="98" text-anchor="middle" fill="#292d28" font-size="18">Heat • wear • risk</text>
    </g>
  </g>
  <text x="42" y="1044" fill="#687066" font-family="Arial, sans-serif" font-size="16">BLACK SCARAB • INSIDE THE PHYSICAL AI FACTORY</text>
</svg>
