<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Industrial automation stack</title><desc id="desc">Six layers from enterprise planning to physical production with commands moving down and evidence moving up.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#657168"/></marker><style>.e{font:600 18px Arial;letter-spacing:3px;fill:#798078}.t{font:700 44px Georgia;fill:#242722}.n{font:700 25px Arial;fill:#252824}.b{font:400 18px Arial;fill:#555b55}.small{font:600 16px Arial;fill:#657168}.line{stroke:#657168;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="960" fill="#f3efe4"/><text x="90" y="85" class="e">INDUSTRIAL AUTOMATION ARCHITECTURE</text><text x="90" y="145" class="t">Different decisions belong at different layers</text><text x="90" y="187" class="b">Data may cross levels, but responsibility, time horizon, and failure behavior remain explicit.</text>
  <g>
    <rect x="250" y="245" width="1100" height="92" rx="18" fill="#eee8da" stroke="#a7a092" stroke-width="2"/><text x="300" y="287" class="n">Enterprise planning</text><text x="660" y="287" class="b">ERP · demand · supply · procurement · finance · orders</text><text x="1260" y="307" text-anchor="end" class="small">DAYS TO MONTHS</text>
    <rect x="250" y="355" width="1100" height="92" rx="18" fill="#e4eadf" stroke="#879681" stroke-width="2"/><text x="300" y="397" class="n">Manufacturing operations</text><text x="660" y="397" class="b">MES · quality · maintenance · warehouse · genealogy</text><text x="1260" y="417" text-anchor="end" class="small">MINUTES TO DAYS</text>
    <rect x="250" y="465" width="1100" height="92" rx="18" fill="#d8e2d6" stroke="#788978" stroke-width="2"/><text x="300" y="507" class="n">Supervision</text><text x="660" y="507" class="b">HMI · SCADA · alarms · historian · operator context</text><text x="1260" y="527" text-anchor="end" class="small">SECONDS TO HOURS</text>
    <rect x="250" y="575" width="1100" height="92" rx="18" fill="#c9d7c8" stroke="#6d806e" stroke-width="2"/><text x="300" y="617" class="n">Control and safety</text><text x="660" y="617" class="b">PLC · CNC · robot · motion · safety controller</text><text x="1260" y="637" text-anchor="end" class="small">MICROSECONDS TO SECONDS</text>
    <rect x="250" y="685" width="1100" height="92" rx="18" fill="#b9cab9" stroke="#637765" stroke-width="2"/><text x="300" y="727" class="n">Sensing and action</text><text x="660" y="727" class="b">Sensors · I/O · drives · motors · valves · actuators</text><text x="1260" y="747" text-anchor="end" class="small">CONTINUOUS MACHINE TIME</text>
    <rect x="250" y="795" width="1100" height="92" rx="18" fill="#2d322e"/><text x="300" y="837" class="n" style="fill:#f7f2e8">Physical production</text><text x="660" y="837" class="b" style="fill:#d8ddd8">Material · energy · machine · fixture · tool · rover</text><text x="1260" y="857" text-anchor="end" class="small" style="fill:#d8ddd8">THE REAL WORLD</text>
  </g>
  <path d="M165 270V830" class="line"/><text x="105" y="505" transform="rotate(-90 105 505)" class="small">AUTHORIZED WORK AND COMMANDS</text>
  <path d="M1435 835V275" class="line"/><text x="1495" y="620" transform="rotate(90 1495 620)" class="small">STATE · RESULT · CONTEXT · EVIDENCE</text>
  <text x="800" y="925" text-anchor="middle" class="b">The model organizes activities. It is not a rule that every factory needs one product in every layer.</text>
</svg>
