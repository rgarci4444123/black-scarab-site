<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">The installed cost stack for manufacturing equipment</title>
  <desc id="desc">A layered cost stack shows the quoted machine as one part of a production ready application.</desc>
  <rect width="720" height="1040" rx="30" fill="#f3efe4"/>
  <text x="42" y="64" fill="#292d28" font-family="Georgia, serif" font-size="32" font-weight="700">The quote is one layer</text>
  <text x="42" y="98" fill="#687066" font-family="Arial, sans-serif" font-size="16">Compare production ready systems.</text>
  <g transform="translate(42 138)" font-family="Arial, sans-serif">
    <rect width="636" height="72" rx="16" fill="#30352f"/><text x="24" y="45" fill="#f8f5ec" font-size="20" font-weight="700">Quoted machine</text>
    <rect x="18" y="88" width="618" height="72" rx="16" fill="#576057"/><text x="42" y="133" fill="#f8f5ec" font-size="20" font-weight="700">Tooling and workholding</text>
    <rect x="36" y="176" width="600" height="72" rx="16" fill="#879180"/><text x="60" y="221" fill="#182019" font-size="20" font-weight="700">Safety and material handling</text>
    <rect x="54" y="264" width="582" height="72" rx="16" fill="#aeb8a5"/><text x="78" y="309" fill="#292d28" font-size="20" font-weight="700">Utilities and facility work</text>
    <rect x="72" y="352" width="564" height="72" rx="16" fill="#d4d9cb"/><text x="96" y="397" fill="#292d28" font-size="20" font-weight="700">Integration and validation</text>
    <rect x="90" y="440" width="546" height="72" rx="16" fill="#e2d8c2"/><text x="114" y="485" fill="#292d28" font-size="20" font-weight="700">Training, spares, launch loss</text>
  </g>
  <g transform="translate(42 694)" font-family="Arial, sans-serif">
    <rect width="636" height="270" rx="22" fill="#fbf8f0" stroke="#a4ad9e" stroke-width="2"/>
    <text x="26" y="40" fill="#566057" font-size="18" letter-spacing="2">BUYER CHECK</text>
    <text x="26" y="79" fill="#292d28" font-family="Georgia, serif" font-size="24" font-weight="700">Can it make an accepted part?</text>
    <g fill="#434a43" font-size="17">
      <text x="26" y="122">Installed • staffed • supplied</text>
      <text x="26" y="162">Measured to the requirement</text>
      <text x="26" y="202">Supported after a fault</text>
      <text x="26" y="242">Recovered without hidden delay</text>
    </g>
  </g>
  <text x="42" y="1010" fill="#687066" font-family="Arial, sans-serif" font-size="16">BLACK SCARAB • INSIDE THE PHYSICAL AI FACTORY</text>
</svg>
