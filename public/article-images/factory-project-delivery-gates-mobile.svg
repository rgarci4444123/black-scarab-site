<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Factory project delivery gates</title>
  <desc id="desc">Mobile timeline from factory project requirement to sustained production support.</desc>
  <rect width="900" height="1500" fill="#f4f0e8"/><rect x="35" y="35" width="830" height="1430" rx="30" fill="#fffdfa" stroke="#d9d4c9"/>
  <text x="80" y="105" fill="#18201d" font-family="Georgia, serif" font-size="39" font-weight="700">Factory projects</text><text x="80" y="150" fill="#18201d" font-family="Georgia, serif" font-size="39" font-weight="700">advance through evidence</text>
  <g font-family="Arial, sans-serif">
    <path d="M150 245 V1245" stroke="#cbd3c9" stroke-width="14" stroke-linecap="round"/>
    <g text-anchor="middle" fill="#fffdfa" font-size="22" font-weight="700"><circle cx="150" cy="270" r="42" fill="#18201d"/><text x="150" y="278">1</text><circle cx="150" cy="425" r="42" fill="#657768"/><text x="150" y="433">2</text><circle cx="150" cy="580" r="42" fill="#7e8d7f"/><text x="150" y="588">3</text><circle cx="150" cy="735" r="42" fill="#c58f5f"/><text x="150" y="743">4</text><circle cx="150" cy="890" r="42" fill="#aa764d"/><text x="150" y="898">5</text><circle cx="150" cy="1045" r="42" fill="#55675a"/><text x="150" y="1053">6</text><circle cx="150" cy="1200" r="42" fill="#18201d"/><text x="150" y="1208">7</text></g>
    <g fill="#18201d" font-size="24" font-weight="700"><text x="230" y="258">Application requirement</text><text x="230" y="413">Concept review</text><text x="230" y="568">Detailed design review</text><text x="230" y="723">Factory acceptance</text><text x="230" y="878">Site acceptance</text><text x="230" y="1033">Production release</text><text x="230" y="1188">Sustained support</text></g>
    <g fill="#667069" font-size="18"><text x="230" y="292">Define result, conditions, and scope boundary</text><text x="230" y="447">Prove feasibility and expose major risk</text><text x="230" y="602">Release the system that will be built</text><text x="230" y="757">Verify functions before shipment</text><text x="230" y="912">Verify installation and real interfaces</text><text x="230" y="1067">Transfer a supportable system to operations</text><text x="230" y="1222">Measure value and control every change</text></g>
    <rect x="80" y="1300" width="740" height="110" rx="22" fill="#18201d"/><text x="450" y="1342" text-anchor="middle" fill="#d6a56f" font-size="17" font-weight="700">TRACEABILITY RULE</text><text x="450" y="1380" text-anchor="middle" fill="#f6f4ef" font-size="18">Every test points back to a released requirement</text>
  </g>
</svg>
