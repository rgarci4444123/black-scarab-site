<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Equipment acceptance chain</title>
  <desc id="desc">Six acceptance stages move requirements and evidence from the purchase package through production release.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6f8a7a"/></marker></defs>
  <rect width="1600" height="1000" rx="36" fill="#f6f2e8"/>
  <text x="88" y="92" fill="#15191b" font-family="Georgia,serif" font-size="48">The equipment acceptance chain</text><text x="88" y="134" fill="#56605b" font-family="Arial,sans-serif" font-size="22">Define proof before purchase, then preserve it through production release.</text>
  <line x1="170" y1="342" x2="1420" y2="342" stroke="#b7c4bc" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(70 226)"><rect width="220" height="232" rx="22" fill="#15191b"/><text x="24" y="42" fill="#91a79a" font-size="17" font-weight="700" letter-spacing="2">01</text><text x="24" y="82" fill="#fff" font-size="24" font-weight="700">Requirements</text><line x1="24" y1="105" x2="196" y2="105" stroke="#3d4944"/><text x="24" y="140" fill="#d7e0da" font-size="17">Function and rate</text><text x="24" y="170" fill="#d7e0da" font-size="17">Quality and interfaces</text><text x="24" y="200" fill="#d7e0da" font-size="17">Acceptance evidence</text></g>
    <g transform="translate(318 226)"><rect width="220" height="232" rx="22" fill="#e2ebe5"/><text x="24" y="42" fill="#52675c" font-size="17" font-weight="700" letter-spacing="2">02</text><text x="24" y="82" fill="#15191b" font-size="24" font-weight="700">Supplier design</text><line x1="24" y1="105" x2="196" y2="105" stroke="#b7c4bc"/><text x="24" y="140" fill="#415048" font-size="17">Drawings and controls</text><text x="24" y="170" fill="#415048" font-size="17">Risk review</text><text x="24" y="200" fill="#415048" font-size="17">Service plan</text></g>
    <g transform="translate(566 226)"><rect width="220" height="232" rx="22" fill="#9caf9f"/><text x="24" y="42" fill="#26312d" font-size="17" font-weight="700" letter-spacing="2">03</text><text x="24" y="82" fill="#15191b" font-size="24" font-weight="700">Factory test</text><line x1="24" y1="105" x2="196" y2="105" stroke="#6f8a7a"/><text x="24" y="140" fill="#26312d" font-size="17">Witness FAT</text><text x="24" y="170" fill="#26312d" font-size="17">Exercise faults</text><text x="24" y="200" fill="#26312d" font-size="17">Record exceptions</text></g>
    <g transform="translate(814 226)"><rect width="220" height="232" rx="22" fill="#fffdf8" stroke="#91a79a" stroke-width="2"/><text x="24" y="42" fill="#52675c" font-size="17" font-weight="700" letter-spacing="2">04</text><text x="24" y="82" fill="#15191b" font-size="24" font-weight="700">Install</text><line x1="24" y1="105" x2="196" y2="105" stroke="#c8d1cb"/><text x="24" y="140" fill="#56605b" font-size="17">Preserve and receive</text><text x="24" y="170" fill="#56605b" font-size="17">Place and connect</text><text x="24" y="200" fill="#56605b" font-size="17">Control changes</text></g>
    <g transform="translate(1062 226)"><rect width="220" height="232" rx="22" fill="#e2ebe5"/><text x="24" y="42" fill="#52675c" font-size="17" font-weight="700" letter-spacing="2">05</text><text x="24" y="82" fill="#15191b" font-size="24" font-weight="700">Site test</text><line x1="24" y1="105" x2="196" y2="105" stroke="#b7c4bc"/><text x="24" y="140" fill="#415048" font-size="17">Use real utilities</text><text x="24" y="170" fill="#415048" font-size="17">Prove interfaces</text><text x="24" y="200" fill="#415048" font-size="17">Verify recovery</text></g>
    <g transform="translate(1310 226)"><rect width="220" height="232" rx="22" fill="#b96f4d"/><text x="24" y="42" fill="#fff4ec" font-size="17" font-weight="700" letter-spacing="2">06</text><text x="24" y="82" fill="#fff" font-size="24" font-weight="700">Release</text><line x1="24" y1="105" x2="196" y2="105" stroke="#d99777"/><text x="24" y="140" fill="#fff4ec" font-size="17">Train the team</text><text x="24" y="170" fill="#fff4ec" font-size="17">Transfer spares</text><text x="24" y="200" fill="#fff4ec" font-size="17">Approve production</text></g>
  </g>
  <rect x="88" y="548" width="1424" height="300" rx="24" fill="#15191b"/><text x="126" y="600" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="24" font-weight="700">THE EVIDENCE TRAVELS WITH THE MACHINE</text>
  <g font-family="Arial,sans-serif"><circle cx="138" cy="668" r="7" fill="#91a79a"/><text x="164" y="675" fill="#d7e0da" font-size="20">Approved drawings and software versions</text><circle cx="138" cy="728" r="7" fill="#91a79a"/><text x="164" y="735" fill="#d7e0da" font-size="20">Test procedures, results, and exception closure</text><circle cx="138" cy="788" r="7" fill="#91a79a"/><text x="164" y="795" fill="#d7e0da" font-size="20">Calibration and safety validation records</text><circle cx="820" cy="668" r="7" fill="#91a79a"/><text x="846" y="675" fill="#d7e0da" font-size="20">Manuals, backups, certificates, and spares</text><circle cx="820" cy="728" r="7" fill="#91a79a"/><text x="846" y="735" fill="#d7e0da" font-size="20">Open item owner, due date, and retest method</text><circle cx="820" cy="788" r="7" fill="#91a79a"/><text x="846" y="795" fill="#d7e0da" font-size="20">Training, warranty start, and support response</text></g>
  <text x="800" y="925" text-anchor="middle" fill="#52675c" font-family="Arial,sans-serif" font-size="21" font-weight="700">FAT reduces delivery risk. SAT proves the installed system. Release proves the operating system.</text>
</svg>
