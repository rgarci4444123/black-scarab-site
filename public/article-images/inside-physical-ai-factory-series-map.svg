      <text x="25" y="101" fill="#20231f" font-size="24" font-weight="700">Build the</text><text x="25" y="131" fill="#20231f" font-size="24" font-weight="700">product</text><text x="25" y="158" fill="#6b6e66" font-size="16">Design to production</text>
