      <text x="25" y="101" fill="#20231f" font-size="24" font-weight="700">See the</text><text x="25" y="131" fill="#20231f" font-size="24" font-weight="700">factory</text><text x="25" y="158" fill="#6b6e66" font-size="16">Types and flows</text>
    </g>
