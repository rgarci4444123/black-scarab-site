      <text x="28" y="102" fill="#20231f" font-size="26" font-weight="700">How manufacturing</text><text x="28" y="134" fill="#20231f" font-size="26" font-weight="700">works</text><text x="28" y="161" fill="#6b6e66" font-size="17">The complete map</text>
