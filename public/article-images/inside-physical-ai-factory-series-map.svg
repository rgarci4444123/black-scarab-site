      <text x="28" y="102" fill="#20231f" font-size="26" font-weight="700">Add physical AI</text><text x="28" y="134" fill="#20231f" font-size="26" font-weight="700">where it earns a role</text><text x="28" y="161" fill="#5b6558" font-size="17">Perceive, decide, act</text>
