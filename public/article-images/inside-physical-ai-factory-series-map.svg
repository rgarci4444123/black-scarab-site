<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Inside the Physical AI Factory series map</title>
  <desc id="desc">Nine connected guides move from factory fundamentals through machinery, product manufacturing, providers, plant design, automation, physical AI, and construction.</desc>
  <defs>
