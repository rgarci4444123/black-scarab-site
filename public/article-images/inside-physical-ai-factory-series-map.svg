      <text x="25" y="101" fill="#20231f" font-size="24" font-weight="700">Learn the</text><text x="25" y="131" fill="#20231f" font-size="24" font-weight="700">machines</text><text x="25" y="158" fill="#6b6e66" font-size="16">Equipment atlas</text>
