      <text x="25" y="101" fill="#20231f" font-size="24" font-weight="700">Connect the</text><text x="25" y="131" fill="#20231f" font-size="24" font-weight="700">automation</text><text x="25" y="158" fill="#5b6558" font-size="16">Control and software</text>
