<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 700" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI decision loop</title>
  <desc id="desc">A vertical six step loop from sensing through verification, with independent safety and continuous monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#6f8a7a"/>
    </marker>
  </defs>
  <rect width="450" height="700" rx="22" fill="#15191b"/>

  <text x="28" y="34" fill="#f6f2e8" font-family="Georgia,serif" font-size="26">The physical AI decision loop</text>
  <text x="28" y="60" fill="#c6d2cb" font-family="Arial,sans-serif" font-size="16">Observation becomes verified physical work.</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(65 82)">
      <rect width="320" height="62" rx="14" fill="#f6f2e8"/>
      <text x="160" y="27" fill="#15191b" font-size="19" font-weight="700">1. Sense</text>
      <text x="160" y="50" fill="#46514c" font-size="16">Images, signals, and context</text>
    </g>
    <g transform="translate(65 157)">
      <rect width="320" height="62" rx="14" fill="#dfe8e2"/>
      <text x="160" y="27" fill="#15191b" font-size="19" font-weight="700">2. Estimate</text>
      <text x="160" y="50" fill="#46514c" font-size="16">Relevant state and uncertainty</text>
    </g>
    <g transform="translate(65 232)">
      <rect width="320" height="62" rx="14" fill="#91a79a"/>
      <text x="160" y="27" fill="#15191b" font-size="19" font-weight="700">3. Decide</text>
      <text x="160" y="50" fill="#26312d" font-size="16">Choose a permitted task action</text>
    </g>
    <g transform="translate(65 307)">
      <rect width="320" height="62" rx="14" fill="#ffffff"/>
      <text x="160" y="27" fill="#15191b" font-size="19" font-weight="700">4. Execute</text>
      <text x="160" y="50" fill="#46514c" font-size="16">Release deterministic control</text>
    </g>
    <g transform="translate(65 382)">
      <rect width="320" height="62" rx="14" fill="#b16f50"/>
      <text x="160" y="27" fill="#ffffff" font-size="19" font-weight="700">5. Act</text>
      <text x="160" y="50" fill="#fff4ec" font-size="16">Change the physical process</text>
    </g>
    <g transform="translate(65 457)">
      <rect width="320" height="62" rx="14" fill="#f6f2e8"/>
      <text x="160" y="27" fill="#15191b" font-size="19" font-weight="700">6. Verify</text>
      <text x="160" y="50" fill="#46514c" font-size="16">Confirm the accepted result</text>
    </g>
  </g>

  <g stroke="#7f9a8b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M225 144V150"/>
    <path d="M225 219V225"/>
    <path d="M225 294V300"/>
    <path d="M225 369V375"/>
    <path d="M225 444V450"/>
    <path d="M65 488H28V113H55"/>
  </g>

  <rect x="50" y="535" width="350" height="92" rx="17" fill="#26312d" stroke="#7f9a8b" stroke-width="2"/>
  <text x="225" y="568" text-anchor="middle" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="18" font-weight="700">Independent safety boundary</text>
  <text x="225" y="594" text-anchor="middle" fill="#c6d2cb" font-family="Arial,sans-serif" font-size="16">Risk reduction does not depend</text>
  <text x="225" y="615" text-anchor="middle" fill="#c6d2cb" font-family="Arial,sans-serif" font-size="16">on the model being correct.</text>

  <rect x="25" y="646" width="400" height="40" rx="20" fill="#dfe8e2"/>
  <text x="225" y="662" text-anchor="middle" fill="#31403a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Monitor • record • review drift</text>
  <text x="225" y="680" text-anchor="middle" fill="#31403a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Validate changes • preserve rollback</text>
</svg>
