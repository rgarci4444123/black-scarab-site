<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">One machine tending cell has five responsibility layers</title>
  <desc id="desc">Products, the control and safety system, application integration, the site, and operations combine to produce accepted machined parts.</desc>
  <rect width="1600" height="1000" fill="#f4f0e8"/><rect x="50" y="50" width="1500" height="900" rx="34" fill="#fffdfa" stroke="#d9d4c9" stroke-width="2"/>
  <text x="100" y="128" fill="#18201d" font-family="Georgia, serif" font-size="46" font-weight="700">One machine tending cell has five responsibility layers</text>
  <text x="100" y="172" fill="#667069" font-family="Arial, sans-serif" font-size="22">The robot is visible, but most project risk lives in the interfaces around it</text>
  <g font-family="Arial, sans-serif">
    <rect x="365" y="225" width="870" height="105" rx="26" fill="#18201d"/>
    <text x="800" y="267" text-anchor="middle" fill="#d6a56f" font-size="18" font-weight="700">OPERATING RESULT</text><text x="800" y="307" text-anchor="middle" fill="#f7f4ed" font-size="28" font-weight="700">Accepted parts at the required rate with safe recovery</text>
    <polygon points="420,360 1180,360 1130,470 470,470" fill="#dfe8df" stroke="#becbbb"/>
    <text x="800" y="405" text-anchor="middle" fill="#445348" font-size="18" font-weight="700">OPERATIONS AND MAINTENANCE</text><text x="800" y="440" text-anchor="middle" fill="#18201d" font-size="23">Staffing • replenishment • changeover • preventive work • escalation</text>
    <polygon points="470,500 1130,500 1080,610 520,610" fill="#f2e8dc" stroke="#dec7ad"/>
    <text x="800" y="545" text-anchor="middle" fill="#9a6841" font-size="18" font-weight="700">APPLICATION INTEGRATION</text><text x="800" y="580" text-anchor="middle" fill="#18201d" font-size="23">Tooling • part flow • sequence • quality • programs • fault recovery</text>
    <polygon points="520,640 1080,640 1030,750 570,750" fill="#e8ece7" stroke="#c8d0c7"/>
    <text x="800" y="685" text-anchor="middle" fill="#657168" font-size="18" font-weight="700">CONTROL AND SAFETY</text><text x="800" y="720" text-anchor="middle" fill="#18201d" font-size="23">PLC • robot controller • machine states • guarding • validation</text>
    <polygon points="570,780 1030,780 980,890 620,890" fill="#303b36"/>
    <text x="800" y="825" text-anchor="middle" fill="#d6a56f" font-size="18" font-weight="700">PRODUCTS</text><text x="800" y="860" text-anchor="middle" fill="#f7f4ed" font-size="23">Machine • robot • gripper • sensors • gauge • panel</text>
    <g fill="#f7f3eb" stroke="#ded8cc">
      <rect x="100" y="300" width="220" height="115" rx="20"/><rect x="1280" y="300" width="220" height="115" rx="20"/>
      <rect x="100" y="470" width="220" height="115" rx="20"/><rect x="1280" y="470" width="220" height="115" rx="20"/>
      <rect x="100" y="640" width="220" height="115" rx="20"/><rect x="1280" y="640" width="220" height="115" rx="20"/>
    </g>
    <text x="210" y="340" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">OWNER</text><text x="210" y="374" text-anchor="middle" fill="#18201d" font-size="19">Requirement</text><text x="210" y="399" text-anchor="middle" fill="#18201d" font-size="19">and acceptance</text>
    <text x="1390" y="340" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">INTEGRATOR</text><text x="1390" y="374" text-anchor="middle" fill="#18201d" font-size="19">Complete cell</text><text x="1390" y="399" text-anchor="middle" fill="#18201d" font-size="19">and interfaces</text>
    <text x="210" y="510" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">FACILITY TEAM</text><text x="210" y="544" text-anchor="middle" fill="#18201d" font-size="19">Floor, utilities,</text><text x="210" y="569" text-anchor="middle" fill="#18201d" font-size="19">network, rigging</text>
    <text x="1390" y="510" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">PLATFORM SUPPLIERS</text><text x="1390" y="544" text-anchor="middle" fill="#18201d" font-size="19">Supported products</text><text x="1390" y="569" text-anchor="middle" fill="#18201d" font-size="19">and tools</text>
    <text x="210" y="680" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">QUALITY TEAM</text><text x="210" y="714" text-anchor="middle" fill="#18201d" font-size="19">Measurement, limits,</text><text x="210" y="739" text-anchor="middle" fill="#18201d" font-size="19">and traceability</text>
    <text x="1390" y="680" text-anchor="middle" fill="#657168" font-size="16" font-weight="700">OPERATIONS</text><text x="1390" y="714" text-anchor="middle" fill="#18201d" font-size="19">People, material,</text><text x="1390" y="739" text-anchor="middle" fill="#18201d" font-size="19">maintenance, support</text>
  </g>
</svg>
