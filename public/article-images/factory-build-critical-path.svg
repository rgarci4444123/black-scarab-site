<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Factory build critical path</title>
  <desc id="desc">Eight decision gates arranged in two phases, followed by four synchronized workstreams required for factory launch.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6f8a7a"/></marker></defs>
  <rect width="1600" height="1000" rx="36" fill="#f6f2e8"/>
  <text x="88" y="92" fill="#15191b" font-family="Georgia,serif" font-size="48">The factory build critical path</text>
  <text x="88" y="134" fill="#56605b" font-family="Arial,sans-serif" font-size="22">Eight gates convert a production basis into accepted output.</text>
  <text x="88" y="205" fill="#6f8a7a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DEFINE THE SYSTEM</text>
  <line x1="184" y1="320" x2="1390" y2="320" stroke="#c8d1cb" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(88 236)"><rect width="320" height="168" rx="20" fill="#fffdf8" stroke="#d9d4c9" stroke-width="2"/><circle cx="44" cy="46" r="25" fill="#15191b"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">01</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Production basis</text><text x="82" y="75" fill="#6f8a7a" font-size="17">Product and route</text><text x="28" y="122" fill="#56605b" font-size="18">Release volume, quality, test,</text><text x="28" y="148" fill="#56605b" font-size="18">make or buy, and traceability.</text></g>
    <g transform="translate(456 236)"><rect width="320" height="168" rx="20" fill="#e7eee9"/><circle cx="44" cy="46" r="25" fill="#6f8a7a"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">02</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Project baseline</text><text x="82" y="75" fill="#52675c" font-size="17">Scope and governance</text><text x="28" y="122" fill="#415048" font-size="18">Approve owners, budget, schedule,</text><text x="28" y="148" fill="#415048" font-size="18">interfaces, and decision gates.</text></g>
    <g transform="translate(824 236)"><rect width="320" height="168" rx="20" fill="#d2ddd6"/><circle cx="44" cy="46" r="25" fill="#52675c"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">03</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Purchase</text><text x="82" y="75" fill="#415048" font-size="17">Requirements and contracts</text><text x="28" y="122" fill="#334039" font-size="18">Issue RFQs with acceptance,</text><text x="28" y="148" fill="#334039" font-size="18">documentation, and support terms.</text></g>
    <g transform="translate(1192 236)"><rect width="320" height="168" rx="20" fill="#fffdf8" stroke="#91a79a" stroke-width="2"/><circle cx="44" cy="46" r="25" fill="#15191b"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">04</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Prepare site</text><text x="82" y="75" fill="#6f8a7a" font-size="17">Building and utilities</text><text x="28" y="122" fill="#56605b" font-size="18">Complete permits, delivery paths,</text><text x="28" y="148" fill="#56605b" font-size="18">power, air, network, and safety.</text></g>
  </g>
  <text x="88" y="474" fill="#6f8a7a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PROVE THE SYSTEM</text>
  <line x1="184" y1="590" x2="1390" y2="590" stroke="#c8d1cb" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(88 506)"><rect width="320" height="168" rx="20" fill="#fffdf8" stroke="#d9d4c9" stroke-width="2"/><circle cx="44" cy="46" r="25" fill="#15191b"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">05</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Factory test</text><text x="82" y="75" fill="#6f8a7a" font-size="17">Witness FAT evidence</text><text x="28" y="122" fill="#56605b" font-size="18">Test functions, faults, records,</text><text x="28" y="148" fill="#56605b" font-size="18">and exceptions before shipment.</text></g>
    <g transform="translate(456 506)"><rect width="320" height="168" rx="20" fill="#e7eee9"/><circle cx="44" cy="46" r="25" fill="#6f8a7a"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">06</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Install</text><text x="82" y="75" fill="#52675c" font-size="17">Receive, place, connect</text><text x="28" y="122" fill="#415048" font-size="18">Protect configuration through</text><text x="28" y="148" fill="#415048" font-size="18">rigging, utilities, and integration.</text></g>
    <g transform="translate(824 506)"><rect width="320" height="168" rx="20" fill="#d2ddd6"/><circle cx="44" cy="46" r="25" fill="#52675c"/><text x="44" y="54" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">07</text><text x="82" y="44" fill="#15191b" font-size="24" font-weight="700">Commission</text><text x="82" y="75" fill="#415048" font-size="17">Prove the full flow</text><text x="28" y="122" fill="#334039" font-size="18">Validate safety, site performance,</text><text x="28" y="148" fill="#334039" font-size="18">recovery, and production records.</text></g>
    <g transform="translate(1192 506)"><rect width="320" height="168" rx="20" fill="#b96f4d"/><circle cx="44" cy="46" r="25" fill="#f6f2e8"/><text x="44" y="54" text-anchor="middle" fill="#15191b" font-size="20" font-weight="700">08</text><text x="82" y="44" fill="#fff" font-size="24" font-weight="700">Release</text><text x="82" y="75" fill="#fff4ec" font-size="17">First accepted run</text><text x="28" y="122" fill="#fff4ec" font-size="18">Approve output only when people,</text><text x="28" y="148" fill="#fff4ec" font-size="18">process, evidence, and cash align.</text></g>
  </g>
  <rect x="88" y="748" width="1424" height="158" rx="22" fill="#15191b"/>
  <text x="120" y="790" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">FOUR WORKSTREAMS MOVE TOGETHER</text>
  <g font-family="Arial,sans-serif"><text x="120" y="842" fill="#91a79a" font-size="18" font-weight="700">FACILITY</text><text x="120" y="872" fill="#d6dfd9" font-size="17">Building and utilities</text><text x="450" y="842" fill="#91a79a" font-size="18" font-weight="700">EQUIPMENT</text><text x="450" y="872" fill="#d6dfd9" font-size="17">Build, test, and install</text><text x="790" y="842" fill="#91a79a" font-size="18" font-weight="700">OPERATIONS</text><text x="790" y="872" fill="#d6dfd9" font-size="17">People, quality, and material</text><text x="1150" y="842" fill="#91a79a" font-size="18" font-weight="700">CASH AND RISK</text><text x="1150" y="872" fill="#d6dfd9" font-size="17">Payments and contingency</text></g>
  <text x="800" y="956" text-anchor="middle" fill="#52675c" font-family="Arial,sans-serif" font-size="20" font-weight="700">Opening day is a system readiness decision, not a delivery date.</text>
</svg>
