<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc">
  <title id="title">Four factory scale options</title><desc id="desc">Vertical comparison of four production ownership models.</desc>
  <rect width="720" height="1440" rx="28" fill="#15191b"/>
  <text x="48" y="66" fill="#f6f2e8" font-family="Georgia,serif" font-size="34">Four ways to own production</text>
  <text x="48" y="102" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="17">Scale the operating model only when evidence supports it.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(48 144)"><rect width="624" height="260" rx="22" fill="#f6f2e8"/><text x="26" y="42" fill="#15191b" font-size="22" font-weight="700">1. Prototype workshop</text><text x="26" y="76" fill="#6f8a7a" font-size="16" font-weight="700">Learn before scaling</text><text x="26" y="118" fill="#56605b" font-size="16">Shared space • flexible tools • outside fabrication</text><text x="26" y="154" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="150" y="154" fill="#56605b" font-size="16">Design and demand still move</text><text x="26" y="194" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="150" y="194" fill="#56605b" font-size="16">Informal process becomes habit</text><text x="26" y="230" fill="#56605b" font-size="15">Own learning, not idle capacity.</text></g>
    <g transform="translate(48 424)"><rect width="624" height="260" rx="22" fill="#dfe8e2"/><text x="26" y="42" fill="#15191b" font-size="22" font-weight="700">2. Minimum viable factory</text><text x="26" y="76" fill="#56605b" font-size="16" font-weight="700">Control the critical steps</text><text x="26" y="118" fill="#56605b" font-size="16">Dedicated bay • owned test • selective fixtures</text><text x="26" y="154" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="150" y="154" fill="#56605b" font-size="16">Early commercial volume matters</text><text x="26" y="194" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="150" y="194" fill="#56605b" font-size="16">Too little support capacity</text><text x="26" y="230" fill="#56605b" font-size="15">Protect the product promise with minimum fixed cost.</text></g>
    <g transform="translate(48 704)"><rect width="624" height="260" rx="22" fill="#91a79a"/><text x="26" y="42" fill="#15191b" font-size="22" font-weight="700">3. Conventional small plant</text><text x="26" y="76" fill="#26312d" font-size="16" font-weight="700">Repeat with discipline</text><text x="26" y="118" fill="#26312d" font-size="16">Dedicated equipment • supervision • quality • maintenance</text><text x="26" y="154" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="150" y="154" fill="#26312d" font-size="16">Demand and process are stable</text><text x="26" y="194" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="150" y="194" fill="#26312d" font-size="16">Fixed cost outruns orders</text><text x="26" y="230" fill="#26312d" font-size="15">Build capacity around a released production system.</text></g>
    <g transform="translate(48 984)"><rect width="624" height="260" rx="22" fill="#26312d" stroke="#91a79a" stroke-width="2"/><text x="26" y="42" fill="#f6f2e8" font-size="22" font-weight="700">4. Selective smart factory</text><text x="26" y="76" fill="#91a79a" font-size="16" font-weight="700">Adapt where value is proven</text><text x="26" y="118" fill="#b9c8bf" font-size="16">Connected records • vision • bounded adaptive cells</text><text x="26" y="154" fill="#f6f2e8" font-size="16" font-weight="700">Best when</text><text x="150" y="154" fill="#b9c8bf" font-size="16">Variation has a proven cost</text><text x="26" y="194" fill="#f6f2e8" font-size="16" font-weight="700">Main risk</text><text x="150" y="194" fill="#b9c8bf" font-size="16">Integration without payoff</text><text x="26" y="230" fill="#b9c8bf" font-size="15">Expand authority only after physical evidence.</text></g>
  </g>
  <rect x="48" y="1280" width="624" height="104" rx="22" fill="#b16f50"/><text x="360" y="1322" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">The right factory is the smallest system</text><text x="360" y="1352" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">that can protect the product promise and support demand.</text>
</svg>
