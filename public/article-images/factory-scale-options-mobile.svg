<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Four production ownership models</title><desc id="desc">Four production models arranged from low fixed capacity to more owned capability.</desc>
  <rect width="720" height="1120" rx="28" fill="#15191b"/>
  <text x="44" y="64" fill="#f6f2e8" font-family="Georgia,serif" font-size="34">Four ways to own production</text>
  <text x="44" y="100" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="17">Scale only when evidence supports the next model.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(44 142)"><rect width="632" height="202" rx="20" fill="#f6f2e8"/><circle cx="34" cy="42" r="22" fill="#15191b"/><text x="34" y="49" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text><text x="72" y="42" fill="#15191b" font-size="22" font-weight="700">Prototype workshop</text><text x="72" y="70" fill="#6f8a7a" font-size="16" font-weight="700">LEARN BEFORE SCALING</text><text x="26" y="114" fill="#414b46" font-size="17">Own: engineering builds and flexible tools</text><text x="26" y="146" fill="#414b46" font-size="17">Use when: design and demand still move</text><text x="26" y="178" fill="#6a5144" font-size="17">Watch: informal process becomes habit</text></g>
    <g transform="translate(44 360)"><rect width="632" height="202" rx="20" fill="#e2ebe5"/><circle cx="34" cy="42" r="22" fill="#6f8a7a"/><text x="34" y="49" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text><text x="72" y="42" fill="#15191b" font-size="22" font-weight="700">Minimum viable factory</text><text x="72" y="70" fill="#52675c" font-size="16" font-weight="700">CONTROL THE CRITICAL STEPS</text><text x="26" y="114" fill="#344239" font-size="17">Own: final assembly, test, and genealogy</text><text x="26" y="146" fill="#344239" font-size="17">Use when: early commercial volume matters</text><text x="26" y="178" fill="#6a5144" font-size="17">Watch: key people become bottlenecks</text></g>
    <g transform="translate(44 578)"><rect width="632" height="202" rx="20" fill="#9caf9f"/><circle cx="34" cy="42" r="22" fill="#26312d"/><text x="34" y="49" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text><text x="72" y="42" fill="#15191b" font-size="22" font-weight="700">Conventional small plant</text><text x="72" y="70" fill="#26312d" font-size="16" font-weight="700">REPEAT WITH DISCIPLINE</text><text x="26" y="114" fill="#26312d" font-size="17">Own: dedicated flow, equipment, and support</text><text x="26" y="146" fill="#26312d" font-size="17">Use when: demand and process are stable</text><text x="26" y="178" fill="#523526" font-size="17">Watch: fixed cost can outrun orders</text></g>
    <g transform="translate(44 796)"><rect width="632" height="202" rx="20" fill="#26312d" stroke="#91a79a" stroke-width="2"/><circle cx="34" cy="42" r="22" fill="#b96f4d"/><text x="34" y="49" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">4</text><text x="72" y="42" fill="#f6f2e8" font-size="22" font-weight="700">Selective smart factory</text><text x="72" y="70" fill="#91a79a" font-size="16" font-weight="700">ADAPT WHERE VALUE IS PROVEN</text><text x="26" y="114" fill="#d7e0da" font-size="17">Own: connected records and bounded cells</text><text x="26" y="146" fill="#d7e0da" font-size="17">Use when: variation has a measured cost</text><text x="26" y="178" fill="#e5b09a" font-size="17">Watch: complexity can exceed payoff</text></g>
  </g>
  <line x1="44" y1="1050" x2="638" y2="1050" stroke="#91a79a" stroke-width="3"/><path d="M638 1038L662 1050L638 1062Z" fill="#91a79a"/><text x="44" y="1083" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="14">LESS FIXED CAPACITY</text><text x="676" y="1083" text-anchor="end" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="14">MORE OWNED CAPABILITY</text>
</svg>
