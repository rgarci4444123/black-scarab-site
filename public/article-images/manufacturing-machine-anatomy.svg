<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of a complete machine application</title>
  <desc id="desc">A clear diagram separates the machine core from tooling, workholding, control, utilities, safety, and measurement.</desc>
  <rect width="1200" height="720" rx="32" fill="#f3efe4"/>
  <text x="64" y="76" fill="#292d28" font-family="Georgia, serif" font-size="38" font-weight="700">The machine is more than the mechanism</text>
  <text x="64" y="112" fill="#687066" font-family="Arial, sans-serif" font-size="17">A usable application connects every element without ambiguity.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(420 182)">
      <rect width="360" height="286" rx="28" fill="#30352f"/>
      <rect x="92" y="64" width="176" height="136" rx="18" fill="#f4f0e5" stroke="#9eaa95" stroke-width="3"/>
      <path d="M180 64v42" stroke="#8f9c86" stroke-width="12" stroke-linecap="round"/>
      <path d="M180 106v38" stroke="#d0b982" stroke-width="7" stroke-linecap="round"/>
      <rect x="130" y="145" width="100" height="28" rx="5" fill="#a9b39f"/>
      <path d="M105 214h150" stroke="#899087" stroke-width="3"/>
      <text x="180" y="244" text-anchor="middle" fill="#c6d0bc" font-size="13" letter-spacing="2">MACHINE CORE</text>
      <text x="180" y="270" text-anchor="middle" fill="#f8f5ec" font-family="Georgia, serif" font-size="20" font-weight="700">Structure • motion • power</text>
    </g>
    <g fill="#fbf8f0" stroke="#a4ad9e" stroke-width="2">
      <rect x="64" y="176" width="270" height="94" rx="18"/>
      <rect x="64" y="306" width="270" height="94" rx="18"/>
      <rect x="64" y="436" width="270" height="94" rx="18"/>
      <rect x="866" y="176" width="270" height="94" rx="18"/>
      <rect x="866" y="306" width="270" height="94" rx="18"/>
      <rect x="866" y="436" width="270" height="94" rx="18"/>
    </g>
    <g fill="#292d28">
      <text x="88" y="212" font-family="Georgia, serif" font-size="22" font-weight="700">Tooling</text><text x="88" y="240" fill="#687066" font-size="15">What touches the material</text>
      <text x="88" y="342" font-family="Georgia, serif" font-size="22" font-weight="700">Workholding</text><text x="88" y="370" fill="#687066" font-size="15">What locates and restrains</text>
      <text x="88" y="472" font-family="Georgia, serif" font-size="22" font-weight="700">Material handling</text><text x="88" y="500" fill="#687066" font-size="15">What enters and leaves</text>
      <text x="890" y="212" font-family="Georgia, serif" font-size="22" font-weight="700">Control</text><text x="890" y="240" fill="#687066" font-size="15">What commands the action</text>
      <text x="890" y="342" font-family="Georgia, serif" font-size="22" font-weight="700">Utilities and safety</text><text x="890" y="370" fill="#687066" font-size="15">What enables and contains</text>
      <text x="890" y="472" font-family="Georgia, serif" font-size="22" font-weight="700">Measurement</text><text x="890" y="500" fill="#687066" font-size="15">What proves the result</text>
    </g>
    <g fill="none" stroke="#8e978c" stroke-width="3">
      <path d="M334 223h56q30 0 30 30"/>
      <path d="M334 353h86"/>
      <path d="M334 483h56q30 0 30-30"/>
      <path d="M866 223h-56q-30 0-30 30"/>
      <path d="M866 353h-86"/>
      <path d="M866 483h-56q-30 0-30-30"/>
    </g>
    <g transform="translate(240 568)">
      <rect width="720" height="78" rx="20" fill="#dfe3d5" stroke="#9ca796" stroke-width="2"/>
      <text x="360" y="33" text-anchor="middle" fill="#566057" font-size="13" letter-spacing="2">THE REAL OUTPUT</text>
      <text x="360" y="59" text-anchor="middle" fill="#292d28" font-size="17">Part • evidence • waste • heat • wear • risk</text>
    </g>
  </g>
  <text x="64" y="684" fill="#687066" font-family="Arial, sans-serif" font-size="13">BLACK SCARAB • INSIDE THE PHYSICAL AI FACTORY</text>
</svg>
