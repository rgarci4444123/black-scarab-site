<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Where robot training data comes from</title>
  <desc id="desc">An analytical map comparing seven robot training data sources by scale and cost efficiency on the horizontal axis and direct action signal on the vertical axis. Cross embodiment pooling appears as a separate transformation layer.</desc>
  <rect width="1600" height="1000" fill="#f7f2e9"/>
  <path d="M72 52h88" stroke="#b44835" stroke-width="7"/>
  <text x="72" y="120" font-family="Georgia, serif" font-size="58" font-style="italic" font-weight="700" fill="#171714">Where robot training data comes from</text>
  <text x="72" y="162" font-family="Arial, sans-serif" font-size="25" fill="#67645e">Seven sources, mapped by scale and the directness of their action signal</text>
  <path d="M72 195h1456" stroke="#d8d0c3" stroke-width="2"/>

  <path d="M235 820V268" stroke="#25241f" stroke-width="3"/>
  <path d="M235 268l-10 20h20z" fill="#25241f"/>
  <path d="M235 820h1285" stroke="#25241f" stroke-width="3"/>
  <path d="M1520 820l-20-10v20z" fill="#25241f"/>
  <path d="M235 540h1285" stroke="#d8d0c3" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="M875 268v552" stroke="#d8d0c3" stroke-width="2" stroke-dasharray="5 10"/>

  <text x="86" y="594" transform="rotate(-90 86 594)" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#25241f">DIRECT ACTION SIGNAL</text>
  <text x="118" y="627" transform="rotate(-90 118 627)" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#77736b">how directly the record teaches robot actions</text>
  <text x="700" y="870" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#25241f">SCALE AND COST EFFICIENCY</text>

  <text x="260" y="302" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#77736b">scarce, costly, robot native</text>

  <g font-family="Arial, sans-serif">
    <rect x="404" y="339" width="22" height="22" fill="#191813"/>
    <text x="444" y="348" font-size="27" font-weight="700" fill="#191813">Real teleoperation</text>
    <text x="444" y="378" font-size="19" fill="#77736b">AgiBot World, DROID</text>

    <rect x="634" y="452" width="22" height="22" fill="#191813"/>
    <text x="610" y="430" text-anchor="end" font-size="27" font-weight="700" fill="#191813">Portable real capture</text>
    <text x="610" y="460" text-anchor="end" font-size="19" fill="#77736b">UMI, Mobile ALOHA</text>

    <rect x="832" y="384" width="22" height="22" fill="#191813"/>
    <text x="872" y="391" font-size="27" font-weight="700" fill="#191813">Fleet and deployment data</text>
    <text x="872" y="421" font-size="19" fill="#77736b">Figure, Tesla, deployed robot fleets</text>

    <rect x="1062" y="566" width="22" height="22" fill="#191813"/>
    <text x="1042" y="555" text-anchor="end" font-size="27" font-weight="700" fill="#191813">Simulation</text>
    <text x="1042" y="585" text-anchor="end" font-size="19" fill="#77736b">Isaac Sim, Isaac Lab, Genesis</text>

    <rect x="1270" y="627" width="22" height="22" fill="#191813"/>
    <text x="1250" y="674" text-anchor="middle" font-size="27" font-weight="700" fill="#191813">World model synthetic</text>
    <text x="1250" y="704" text-anchor="middle" font-size="19" fill="#77736b">Cosmos 3 policy variants</text>

    <rect x="1094" y="697" width="22" height="22" fill="#191813"/>
    <text x="1074" y="686" text-anchor="end" font-size="27" font-weight="700" fill="#191813">First person video</text>
    <text x="1074" y="716" text-anchor="end" font-size="19" fill="#77736b">Ego4D, Project Aria</text>

    <rect x="1430" y="760" width="22" height="22" fill="#191813"/>
    <text x="1410" y="750" text-anchor="end" font-size="27" font-weight="700" fill="#191813">Internet video</text>
    <text x="1410" y="780" text-anchor="end" font-size="19" fill="#77736b">Web video</text>

    <rect x="930" y="470" width="22" height="22" fill="none" stroke="#7a8b68" stroke-width="4" stroke-dasharray="5 4"/>
    <text x="970" y="479" font-size="23" font-weight="700" fill="#526147">Cross embodiment pooling</text>
    <text x="970" y="507" font-size="18" fill="#77736b">A transformation layer, not a new source</text>

    <rect x="1400" y="308" width="28" height="28" fill="none" stroke="#b44835" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="1414" y="282" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="5" fill="#b44835">THE FRONTIER</text>
    <text x="1414" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#5f5a52">robot native action data at scale</text>
  </g>

  <text x="800" y="918" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#77736b">Illustrative positioning. The useful mix depends on the task, embodiment, sensors, and learning objective.</text>
  <text x="72" y="958" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#77736b">BLACK SCARAB ANALYSIS   CONCEPT ADAPTED FROM CORE MATTER   2026</text>
</svg>
