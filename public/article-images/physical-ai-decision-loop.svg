<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI decision loop</title><desc id="desc">Sensing, estimation, decision, deterministic execution, physical work, and verification with independent safety.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f8a7a"/></marker></defs>
  <rect width="1200" height="650" rx="28" fill="#15191b"/>
  <text x="70" y="72" fill="#f6f2e8" font-family="Georgia,serif" font-size="36">The physical AI decision loop</text>
  <text x="70" y="108" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="18">Useful intelligence connects an observation to verified physical work.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(125 220)"><rect x="-75" y="-55" width="150" height="110" rx="18" fill="#f6f2e8"/><text y="-8" fill="#15191b" font-size="20" font-weight="700">Sense</text><text y="22" fill="#56605b" font-size="15">Images and signals</text></g>
    <g transform="translate(315 220)"><rect x="-75" y="-55" width="150" height="110" rx="18" fill="#dfe8e2"/><text y="-8" fill="#15191b" font-size="20" font-weight="700">Estimate</text><text y="22" fill="#56605b" font-size="15">State and uncertainty</text></g>
    <g transform="translate(505 220)"><rect x="-75" y="-55" width="150" height="110" rx="18" fill="#91a79a"/><text y="-8" fill="#15191b" font-size="20" font-weight="700">Decide</text><text y="22" fill="#26312d" font-size="15">Permitted task action</text></g>
    <g transform="translate(705 220)"><rect x="-85" y="-55" width="170" height="110" rx="18" fill="#ffffff"/><text y="-8" fill="#15191b" font-size="20" font-weight="700">Execute</text><text y="22" fill="#56605b" font-size="15">Released control</text></g>
    <g transform="translate(915 220)"><rect x="-75" y="-55" width="150" height="110" rx="18" fill="#b16f50"/><text y="-8" fill="#fff" font-size="20" font-weight="700">Act</text><text y="22" fill="#fff4ec" font-size="15">Physical process</text></g>
    <g transform="translate(1075 390)"><rect x="-75" y="-55" width="150" height="110" rx="18" fill="#f6f2e8"/><text y="-8" fill="#15191b" font-size="20" font-weight="700">Verify</text><text y="22" fill="#56605b" font-size="15">Accepted result</text></g>
  </g>
  <g stroke="#6f8a7a" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M200 220H230"/><path d="M390 220H420"/><path d="M580 220H610"/><path d="M790 220H830"/><path d="M990 245Q1075 270 1075 325"/><path d="M1000 390H300Q125 390 125 285"/></g>
  <rect x="300" y="480" width="600" height="88" rx="20" fill="#26312d" stroke="#6f8a7a" stroke-width="2"/>
  <text x="600" y="518" text-anchor="middle" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Independent safety boundary</text>
  <text x="600" y="548" text-anchor="middle" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="16">Risk reduction does not depend on the model being correct.</text>
  <path d="M705 480V290" stroke="#b16f50" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="70" y="588" width="1060" height="34" rx="17" fill="#dfe8e2"/><text x="600" y="611" text-anchor="middle" fill="#31403a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Monitor • record • review drift • validate changes • preserve rollback</text>
</svg>
