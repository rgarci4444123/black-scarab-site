<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI decision loop</title>
  <desc id="desc">A six step loop from sensing through verification, with independent safety and continuous monitoring.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L16 8L0 16Z" fill="#6f8a7a"/>
    </marker>
  </defs>
  <rect width="1000" height="625" rx="28" fill="#15191b"/>

  <text x="56" y="52" fill="#f6f2e8" font-family="Georgia,serif" font-size="32">The physical AI decision loop</text>
  <text x="56" y="81" fill="#c6d2cb" font-family="Arial,sans-serif" font-size="17">Useful intelligence connects observation to verified physical work.</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(60 110)">
      <rect width="250" height="90" rx="18" fill="#f6f2e8"/>
      <text x="125" y="39" fill="#15191b" font-size="22" font-weight="700">1. Sense</text>
      <text x="125" y="65" fill="#46514c" font-size="17">Images and signals</text>
    </g>
    <g transform="translate(375 110)">
      <rect width="250" height="90" rx="18" fill="#dfe8e2"/>
      <text x="125" y="39" fill="#15191b" font-size="22" font-weight="700">2. Estimate</text>
      <text x="125" y="65" fill="#46514c" font-size="17">State and uncertainty</text>
    </g>
    <g transform="translate(690 110)">
      <rect width="250" height="90" rx="18" fill="#91a79a"/>
      <text x="125" y="39" fill="#15191b" font-size="22" font-weight="700">3. Decide</text>
      <text x="125" y="65" fill="#26312d" font-size="17">Choose a permitted action</text>
    </g>
    <g transform="translate(690 275)">
      <rect width="250" height="90" rx="18" fill="#ffffff"/>
      <text x="125" y="39" fill="#15191b" font-size="22" font-weight="700">4. Execute</text>
      <text x="125" y="65" fill="#46514c" font-size="17">Release deterministic control</text>
    </g>
    <g transform="translate(375 275)">
      <rect width="250" height="90" rx="18" fill="#b16f50"/>
      <text x="125" y="39" fill="#ffffff" font-size="22" font-weight="700">5. Act</text>
      <text x="125" y="65" fill="#fff4ec" font-size="17">Change the physical process</text>
    </g>
    <g transform="translate(60 275)">
      <rect width="250" height="90" rx="18" fill="#f6f2e8"/>
      <text x="125" y="39" fill="#15191b" font-size="22" font-weight="700">6. Verify</text>
      <text x="125" y="65" fill="#46514c" font-size="17">Confirm the accepted result</text>
    </g>
  </g>

  <g stroke="#7f9a8b" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M310 155H363"/>
    <path d="M625 155H678"/>
    <path d="M815 200V263"/>
    <path d="M690 320H637"/>
    <path d="M375 320H322"/>
    <path d="M60 320H38V155H48"/>
  </g>

  <path d="M815 365V410" stroke="#c47a55" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="130" y="410" width="740" height="78" rx="20" fill="#26312d" stroke="#7f9a8b" stroke-width="2"/>
  <text x="500" y="443" text-anchor="middle" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Independent safety boundary</text>
  <text x="500" y="469" text-anchor="middle" fill="#c6d2cb" font-family="Arial,sans-serif" font-size="16">Risk reduction does not depend on the model being correct.</text>

  <rect x="60" y="535" width="880" height="46" rx="23" fill="#dfe8e2"/>
  <text x="500" y="565" text-anchor="middle" fill="#31403a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Monitor • record • review drift • validate changes • preserve rollback</text>
</svg>
