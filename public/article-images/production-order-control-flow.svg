<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Production order to production record</title><desc id="desc">A rover order moves through planning, dispatch, cell control, physical work, verification, genealogy, and completion.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#667268"/></marker><style>.e{font:600 18px Arial;letter-spacing:3px;fill:#798078}.t{font:700 44px Georgia;fill:#242722}.n{font:700 22px Arial;fill:#252824}.b{font:400 17px Arial;fill:#555b55}.s{font:600 14px Arial;fill:#657168}.ln{stroke:#667268;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="940" fill="#f3efe4"/><text x="90" y="85" class="e">ROVER ORDER R1042 · ILLUSTRATIVE</text><text x="90" y="145" class="t">From business intent to physical evidence</text><text x="90" y="185" class="b">The order gains machine context on the way down and returns as a completed production record.</text>
  <g>
    <rect x="80" y="290" width="180" height="210" rx="20" fill="#eee8da" stroke="#9f988b" stroke-width="2"/><text x="105" y="337" class="s">01 · PLAN</text><text x="105" y="382" class="n">Enterprise</text><text x="105" y="422" class="b">Build one rover</text><text x="105" y="450" class="b">Revision C</text>
    <rect x="290" y="290" width="180" height="210" rx="20" fill="#e4eadf" stroke="#879681" stroke-width="2"/><text x="315" y="337" class="s">02 · DISPATCH</text><text x="315" y="382" class="n">MES or MOM</text><text x="315" y="422" class="b">Release route</text><text x="315" y="450" class="b">Assign identity</text>
    <rect x="500" y="290" width="180" height="210" rx="20" fill="#dce6da" stroke="#7d8e7e" stroke-width="2"/><text x="525" y="337" class="s">03 · CONFIGURE</text><text x="525" y="382" class="n">Cell</text><text x="525" y="422" class="b">Verify program</text><text x="525" y="450" class="b">Tool and recipe</text>
    <rect x="710" y="290" width="180" height="210" rx="20" fill="#cad9c9" stroke="#6f8270" stroke-width="2"/><text x="735" y="337" class="s">04 · CONTROL</text><text x="735" y="382" class="n">PLC and devices</text><text x="735" y="422" class="b">Run sequence</text><text x="735" y="450" class="b">Handle faults</text>
    <rect x="920" y="290" width="180" height="210" rx="20" fill="#2d322e"/><text x="945" y="337" class="s" style="fill:#d9ded9">05 · ACT</text><text x="945" y="382" class="n" style="fill:#f7f2e8">Physical work</text><text x="945" y="422" class="b" style="fill:#d9ded9">Clamp · move</text><text x="945" y="450" class="b" style="fill:#d9ded9">Tighten · test</text>
    <rect x="1130" y="290" width="180" height="210" rx="20" fill="#dce6da" stroke="#7d8e7e" stroke-width="2"/><text x="1155" y="337" class="s">06 · VERIFY</text><text x="1155" y="382" class="n">Quality result</text><text x="1155" y="422" class="b">Value and limits</text><text x="1155" y="450" class="b">Pass · fail · fault</text>
    <rect x="1340" y="290" width="180" height="210" rx="20" fill="#eee8da" stroke="#9f988b" stroke-width="2"/><text x="1365" y="337" class="s">07 · COMPLETE</text><text x="1365" y="382" class="n">Production record</text><text x="1365" y="422" class="b">Genealogy</text><text x="1365" y="450" class="b">Inventory status</text>
  </g>
  <path d="M260 395H280M470 395H490M680 395H700M890 395H910M1100 395H1120M1310 395H1330" class="ln"/>
  <rect x="290" y="625" width="1020" height="170" rx="22" fill="#fbf8ef" stroke="#9aa39a" stroke-width="2"/><text x="340" y="675" class="n">Context that must survive the journey</text><text x="340" y="720" class="b">Product · revision · serial identity · material lot · route · program · recipe · tool · equipment</text><text x="340" y="758" class="b">Value · unit · limit · quality · timestamp · user · source · version · disposition · audit trail</text>
  <path d="M1425 510V570H800V615" class="ln"/><text x="1095" y="558" class="s">RESULTS RETURN WITH IDENTITY AND CONTEXT</text>
  <text x="90" y="875" class="b">A machine event becomes business truth only after identity, acceptance, and production context are preserved.</text>
</svg>
