<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Machine tending responsibility stack</title>
  <desc id="desc">Mobile diagram of the operating, integration, control, facility, and product layers behind one machine tending cell.</desc>
  <rect width="900" height="1400" fill="#f4f0e8"/><rect x="35" y="35" width="830" height="1330" rx="30" fill="#fffdfa" stroke="#d9d4c9"/>
  <text x="80" y="105" fill="#18201d" font-family="Georgia, serif" font-size="39" font-weight="700">Machine tending</text><text x="80" y="150" fill="#18201d" font-family="Georgia, serif" font-size="39" font-weight="700">responsibility stack</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="740" height="145" rx="24" fill="#18201d"/><text x="450" y="250" text-anchor="middle" fill="#d6a56f" font-size="17" font-weight="700">OPERATING RESULT</text><text x="450" y="292" text-anchor="middle" fill="#f7f4ed" font-size="24" font-weight="700">Accepted parts at the required rate</text><text x="450" y="324" text-anchor="middle" fill="#d1d9d2" font-size="18">with safe and documented recovery</text>
    <rect x="100" y="390" width="700" height="150" rx="24" fill="#dfe8df"/><text x="450" y="435" text-anchor="middle" fill="#445348" font-size="17" font-weight="700">OPERATIONS AND MAINTENANCE</text><text x="450" y="478" text-anchor="middle" fill="#18201d" font-size="20">Staffing • material • changeover</text><text x="450" y="510" text-anchor="middle" fill="#18201d" font-size="20">preventive work • escalation</text>
    <rect x="125" y="575" width="650" height="150" rx="24" fill="#f2e8dc"/><text x="450" y="620" text-anchor="middle" fill="#9a6841" font-size="17" font-weight="700">APPLICATION INTEGRATION</text><text x="450" y="663" text-anchor="middle" fill="#18201d" font-size="20">Tooling • part flow • quality • programs</text><text x="450" y="695" text-anchor="middle" fill="#18201d" font-size="20">sequence • fault recovery</text>
    <rect x="150" y="760" width="600" height="150" rx="24" fill="#e8ece7"/><text x="450" y="805" text-anchor="middle" fill="#657168" font-size="17" font-weight="700">CONTROL AND SAFETY</text><text x="450" y="848" text-anchor="middle" fill="#18201d" font-size="20">PLC • robot and machine states</text><text x="450" y="880" text-anchor="middle" fill="#18201d" font-size="20">guarding • safety validation</text>
    <rect x="175" y="945" width="550" height="150" rx="24" fill="#303b36"/><text x="450" y="990" text-anchor="middle" fill="#d6a56f" font-size="17" font-weight="700">PRODUCTS</text><text x="450" y="1033" text-anchor="middle" fill="#f7f4ed" font-size="20">Machine • robot • gripper • sensors</text><text x="450" y="1065" text-anchor="middle" fill="#f7f4ed" font-size="20">gauge • electrical panel</text>
    <rect x="80" y="1140" width="740" height="155" rx="24" fill="#f7f3eb" stroke="#ded8cc"/><text x="115" y="1182" fill="#657168" font-size="17" font-weight="700">CONNECTED RESPONSIBILITIES</text><text x="115" y="1222" fill="#18201d" font-size="19">Owner • integrator • facility team • quality</text><text x="115" y="1254" fill="#18201d" font-size="19">platform suppliers • operations and maintenance</text><text x="450" y="1335" text-anchor="middle" fill="#657168" font-size="15">The robot is visible. The interfaces determine the result.</text>
  </g>
</svg>
