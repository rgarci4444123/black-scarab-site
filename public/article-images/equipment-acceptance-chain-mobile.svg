<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Equipment acceptance chain</title><desc id="desc">Six equipment acceptance stages with evidence that travels through release.</desc>
  <rect width="720" height="1120" rx="28" fill="#f6f2e8"/>
  <text x="44" y="64" fill="#15191b" font-family="Georgia,serif" font-size="34">The equipment acceptance chain</text>
  <text x="44" y="100" fill="#56605b" font-family="Arial,sans-serif" font-size="17">Define proof before purchase and preserve it through release.</text>
  <line x1="82" y1="168" x2="82" y2="674" stroke="#91a79a" stroke-width="4"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(82 174)"><circle r="27" fill="#15191b"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">01</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Requirements</text><text x="50" y="23" fill="#56605b" font-size="16">Function, quality, interfaces, and evidence</text></g>
    <g transform="translate(82 274)"><circle r="27" fill="#6f8a7a"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">02</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Supplier design</text><text x="50" y="23" fill="#56605b" font-size="16">Drawings, controls, risk, and service plan</text></g>
    <g transform="translate(82 374)"><circle r="27" fill="#52675c"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">03</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Factory test</text><text x="50" y="23" fill="#56605b" font-size="16">Witness FAT, exercise faults, record exceptions</text></g>
    <g transform="translate(82 474)"><circle r="27" fill="#15191b"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">04</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Install</text><text x="50" y="23" fill="#56605b" font-size="16">Preserve, receive, connect, and control changes</text></g>
    <g transform="translate(82 574)"><circle r="27" fill="#6f8a7a"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">05</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Site test</text><text x="50" y="23" fill="#56605b" font-size="16">Use real utilities and prove interfaces</text></g>
    <g transform="translate(82 674)"><circle r="27" fill="#b96f4d"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">06</text><text x="50" y="-4" fill="#15191b" font-size="21" font-weight="700">Production release</text><text x="50" y="23" fill="#56605b" font-size="16">Train the team, transfer spares, approve output</text></g>
  </g>
  <rect x="44" y="742" width="632" height="300" rx="22" fill="#15191b"/>
  <text x="70" y="786" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="19" font-weight="700">EVIDENCE TRAVELS WITH THE MACHINE</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#d7e0da"><circle cx="76" cy="832" r="5" fill="#91a79a"/><text x="94" y="838">Approved drawings and software versions</text><circle cx="76" cy="876" r="5" fill="#91a79a"/><text x="94" y="882">Test results and exception closure</text><circle cx="76" cy="920" r="5" fill="#91a79a"/><text x="94" y="926">Manuals, backups, certificates, and spares</text><circle cx="76" cy="964" r="5" fill="#91a79a"/><text x="94" y="970">Calibration, validation, training, and support</text></g>
  <text x="360" y="1020" text-anchor="middle" fill="#91a79a" font-family="Arial,sans-serif" font-size="15">Factory test, site test, then production release.</text>
  <text x="360" y="1082" text-anchor="middle" fill="#52675c" font-family="Arial,sans-serif" font-size="16" font-weight="700">Acceptance is an evidence chain, not a delivery event.</text>
</svg>
