<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc">
  <title id="title">Equipment acceptance chain</title><desc id="desc">Vertical chain from requirements to production release.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f8a7a"/></marker></defs>
  <rect width="720" height="1240" rx="28" fill="#f6f2e8"/>
  <text x="48" y="66" fill="#15191b" font-family="Georgia,serif" font-size="34">The equipment acceptance chain</text>
  <text x="48" y="102" fill="#56605b" font-family="Arial,sans-serif" font-size="17">Define the evidence before purchase.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(360 184)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#15191b"/><text y="-4" fill="#fff" font-size="21" font-weight="700">1. Requirements</text><text y="26" fill="#b9c8bf" font-size="16">Function, rate, quality, interfaces, evidence</text></g>
    <g transform="translate(360 314)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#dfe8e2"/><text y="-4" fill="#15191b" font-size="21" font-weight="700">2. Supplier design</text><text y="26" fill="#56605b" font-size="16">Drawings, controls, risk, service plan</text></g>
    <g transform="translate(360 444)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#91a79a"/><text y="-4" fill="#15191b" font-size="21" font-weight="700">3. Factory test</text><text y="26" fill="#26312d" font-size="16">Witness FAT and close exceptions</text></g>
    <g transform="translate(360 574)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#fff" stroke="#91a79a" stroke-width="2"/><text y="-4" fill="#15191b" font-size="21" font-weight="700">4. Ship and install</text><text y="26" fill="#56605b" font-size="16">Preserve, receive, place, connect</text></g>
    <g transform="translate(360 704)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#dfe8e2"/><text y="-4" fill="#15191b" font-size="21" font-weight="700">5. Site test</text><text y="26" fill="#56605b" font-size="16">SAT with real utilities and interfaces</text></g>
    <g transform="translate(360 834)"><rect x="-250" y="-45" width="500" height="90" rx="18" fill="#b16f50"/><text y="-4" fill="#fff" font-size="21" font-weight="700">6. Production release</text><text y="26" fill="#fff4ec" font-size="16">Training, spares, documents, signoff</text></g>
  </g>
  <g stroke="#6f8a7a" stroke-width="5" marker-end="url(#arrow)"><path d="M360 230V260"/><path d="M360 360V390"/><path d="M360 490V520"/><path d="M360 620V650"/><path d="M360 750V780"/></g>
  <rect x="48" y="930" width="624" height="232" rx="24" fill="#15191b"/>
  <text x="76" y="972" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Evidence that follows the machine</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#b9c8bf"><text x="76" y="1014">• Approved drawings and software</text><text x="76" y="1050">• Test results and exception closure</text><text x="76" y="1086">• Manuals, backups, certificates, spares</text><text x="76" y="1122">• Calibration, validation, training, support</text></g>
  <text x="360" y="1202" text-anchor="middle" fill="#56605b" font-family="Arial,sans-serif" font-size="15" font-weight="700">Factory test, site test, then production release.</text>
</svg>
