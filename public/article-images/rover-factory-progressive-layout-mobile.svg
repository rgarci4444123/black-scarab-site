<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2100" viewBox="0 0 900 2100" role="img" aria-labelledby="title desc">
  <title id="title">Progressive rover factory layout</title>
  <desc id="desc">Three compact floor plans show a prototype workshop, a controlled commercial cell, and a repeatable factory with expansion space.</desc>
  <rect width="900" height="2100" fill="#f5f0e6"/>
  <text x="65" y="80" fill="#1d2420" font-family="Arial, sans-serif" font-size="42" font-weight="700">One product, three stages</text><text x="65" y="124" fill="#69716b" font-family="Arial, sans-serif" font-size="21">Control grows with evidence and volume</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 180)"><rect width="780" height="550" rx="28" fill="#fffdf7" stroke="#627169" stroke-width="4"/><text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">First 10 prototypes</text><text x="35" y="88" fill="#6b746e" font-size="18">Flexible engineering workshop</text><rect x="35" y="125" width="220" height="100" rx="14" fill="#dbe4de"/><text x="145" y="184" text-anchor="middle" fill="#26312c" font-size="18" font-weight="700">Parts and tools</text><rect x="280" y="125" width="220" height="100" rx="14" fill="#8da196"/><text x="390" y="184" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Build benches</text><rect x="525" y="125" width="220" height="100" rx="14" fill="#eadfc9"/><text x="635" y="174" text-anchor="middle" fill="#26312c" font-size="18" font-weight="700">Engineering</text><text x="635" y="200" text-anchor="middle" fill="#56645d" font-size="15">and records</text><path d="M255 175 H280 M500 175 H525" stroke="#c79a56" stroke-width="7"/><rect x="130" y="285" width="235" height="130" rx="14" fill="#34413b"/><text x="247" y="342" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Software and calibration</text><rect x="415" y="285" width="235" height="130" rx="14" fill="#b77a4a"/><text x="532" y="342" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Safe functional test</text><path d="M365 350 H415" stroke="#c79a56" stroke-width="7"/><text x="35" y="490" fill="#6b746e" font-size="18">Learn the route and stabilize the product</text></g>
    <g transform="translate(60 780)"><rect width="780" height="550" rx="28" fill="#fffdf7" stroke="#627169" stroke-width="4"/><text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">First 100 commercial units</text><text x="35" y="88" fill="#6b746e" font-size="18">Controlled cell and traceable output</text><rect x="35" y="125" width="160" height="100" rx="14" fill="#dbe4de"/><text x="115" y="174" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Receiving</text><text x="115" y="199" text-anchor="middle" fill="#56645d" font-size="14">and quality</text><rect x="215" y="125" width="160" height="100" rx="14" fill="#eadfc9"/><text x="295" y="184" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Storage</text><rect x="395" y="125" width="160" height="100" rx="14" fill="#dbe4de"/><text x="475" y="184" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Kitting</text><rect x="575" y="125" width="170" height="100" rx="14" fill="#8da196"/><text x="660" y="174" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Assembly</text><text x="660" y="199" text-anchor="middle" fill="#fff" font-size="14">three stations</text><path d="M195 175 H215 M375 175 H395 M555 175 H575" stroke="#c79a56" stroke-width="7"/><rect x="130" y="285" width="235" height="130" rx="14" fill="#34413b"/><text x="247" y="342" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Calibration and test</text><rect x="415" y="285" width="235" height="130" rx="14" fill="#b77a4a"/><text x="532" y="342" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Pack and ship</text><path d="M365 350 H415" stroke="#c79a56" stroke-width="7"/><text x="35" y="490" fill="#6b746e" font-size="18">Make every build repeatable and traceable</text></g>
    <g transform="translate(60 1380)"><rect width="780" height="620" rx="28" fill="#fffdf7" stroke="#627169" stroke-width="4"/><text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">Capacity for 1,000 units</text><text x="35" y="88" fill="#6b746e" font-size="18">Repeatable flow with a practical growth option</text><rect x="35" y="125" width="160" height="100" rx="14" fill="#dbe4de"/><text x="115" y="184" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Inbound</text><rect x="215" y="125" width="160" height="100" rx="14" fill="#eadfc9"/><text x="295" y="174" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Supermarket</text><text x="295" y="199" text-anchor="middle" fill="#56645d" font-size="14">and kits</text><rect x="395" y="125" width="350" height="100" rx="14" fill="#8da196"/><text x="570" y="174" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Balanced assembly cell 1</text><text x="570" y="199" text-anchor="middle" fill="#fff" font-size="14">Standard replenishment route</text><path d="M195 175 H215 M375 175 H395" stroke="#c79a56" stroke-width="7"/><rect x="130" y="285" width="235" height="120" rx="14" fill="#34413b"/><text x="247" y="337" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Parallel calibration</text><text x="247" y="364" text-anchor="middle" fill="#dce4de" font-size="15">and test</text><rect x="415" y="285" width="235" height="120" rx="14" fill="#b77a4a"/><text x="532" y="337" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Pack and outbound</text><path d="M365 345 H415" stroke="#c79a56" stroke-width="7"/><rect x="130" y="450" width="520" height="85" rx="14" fill="none" stroke="#7f9589" stroke-width="4" stroke-dasharray="12 10"/><text x="390" y="501" text-anchor="middle" fill="#60736a" font-size="18" font-weight="700">Reserved bay for another cell or test capacity</text><text x="35" y="580" fill="#6b746e" font-size="18">Deliver predictable output and preserve growth</text></g>
  </g>
  <text x="450" y="2060" text-anchor="middle" fill="#69716b" font-family="Arial, sans-serif" font-size="18">Illustrative relationships only. Real dimensions require site evidence.</text>
</svg>
