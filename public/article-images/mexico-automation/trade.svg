he cost of disruption. Exposure remains unequal.</text><line x1="88" y1="885" x2="1512" y2="885" stroke="#e1e6dc" stroke-width="2"/><text x="88" y="934" font-family="Arial, sans-serif" font-size="23" fill="#59625c" font-weight="400">Source: USTR, Mexico trade summary, accessed September 12, 2026. Not GDP or value added.</text></svg>