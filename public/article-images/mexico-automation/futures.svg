<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f6f4ef"/><text x="88" y="83" font-family="Arial, sans-serif" font-size="23" fill="#748775" font-weight="700">BLACK SCARAB  /  INSIGHTS</text><text x="88" y="155" font-family="Arial, sans-serif" font-size="51" fill="#222925" font-weight="700">Two paths through the investment cycle</text><text x="88" y="211" font-family="Arial, sans-serif" font-size="28" fill="#59625c" font-weight="400">CONDITIONAL SCENARIOS  •  No predicted crossover date or assigned probability</text><text x="88" y="300" font-family="Arial, sans-serif" font-size="29" fill="#222925" font-weight="700">DELAYED UPGRADES</text><text x="855" y="300" font-family="Arial, sans-serif" font-size="29" fill="#748775" font-weight="700">SUSTAINED UPGRADES</text><line x1="800" y1="280" x2="800" y2="795" stroke="#e1e6dc" stroke-width="2"/><text x="88" y="388" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">01</text><text x="153" y="388" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Limited process improvement</text><text x="153" y="436" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Low labor cost carries more of the bid</text><text x="855" y="388" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">01</text><text x="920" y="388" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Improve plants and suppliers</text><text x="920" y="436" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Build skill, service and useful uptime</text><text x="88" y="533" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">02</text><text x="153" y="533" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Competitors improve faster</text><text x="153" y="581" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">New programs become harder to win</text><text x="855" y="533" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">02</text><text x="920" y="533" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Quality and cost improve</text><text x="920" y="581" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Existing capacity becomes more valuable</text><text x="88" y="678" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">03</text><text x="153" y="678" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Capacity is awarded elsewhere</text><text x="153" y="726" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Supplier learning can follow the work</text><text x="855" y="678" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">03</text><text x="920" y="678" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Expansion bids become stronger</text><text x="920" y="726" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Rebuilding elsewhere must clear a higher bar</text><text x="88" y="830" font-family="Arial, sans-serif" font-size="29" fill="#59625c" font-weight="400">Both paths remain exposed to demand, trade policy, utilities and execution.</text><line x1="88" y1="885" x2="1512" y2="885" stroke="#e1e6dc" stroke-width="2"/><text x="88" y="934" font-family="Arial, sans-serif" font-size="23" fill="#59625c" font-weight="400">Source: Black Scarab analysis. Sequences illustrate mechanisms, not measured causal estimates.</text></svg>