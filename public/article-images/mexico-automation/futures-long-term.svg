<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f6f4ef"/><text x="88" y="83" font-family="Arial, sans-serif" font-size="23" fill="#748775" font-weight="700">BLACK SCARAB  /  INSIGHTS</text><text x="88" y="155" font-family="Arial, sans-serif" font-size="51" fill="#222925" font-weight="700">Two different economies in twenty years</text><text x="88" y="211" font-family="Arial, sans-serif" font-size="28" fill="#59625c" font-weight="400">CONDITIONAL SCENARIOS  •  Successive investment decisions shape the outcome</text><text x="88" y="300" font-family="Arial, sans-serif" font-size="29" fill="#222925" font-weight="700">DELAYED UPGRADES</text><text x="855" y="300" font-family="Arial, sans-serif" font-size="29" fill="#748775" font-weight="700">SUSTAINED UPGRADES</text><line x1="800" y1="280" x2="800" y2="795" stroke="#e1e6dc" stroke-width="2"/><text x="88" y="388" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">01</text><text x="153" y="388" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Productivity falls behind</text><text x="153" y="436" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Production awards migrate elsewhere</text><text x="855" y="388" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">01</text><text x="920" y="388" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Sustain investment and adoption</text><text x="920" y="436" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Build skills alongside productive capacity</text><text x="88" y="533" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">02</text><text x="153" y="533" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Industrial clusters weaken</text><text x="153" y="581" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Suppliers lose work, skills and investment</text><text x="855" y="533" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">02</text><text x="920" y="533" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Industry keeps improving</text><text x="920" y="581" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Suppliers compete in evolving value chains</text><text x="88" y="678" font-family="Arial, sans-serif" font-size="25" fill="#222925" font-weight="700">03</text><text x="153" y="678" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">Living standards face pressure</text><text x="153" y="726" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">Weaker incomes and public finances</text><text x="855" y="678" font-family="Arial, sans-serif" font-size="25" fill="#748775" font-weight="700">03</text><text x="920" y="678" font-family="Arial, sans-serif" font-size="30" fill="#222925" font-weight="700">A stronger base for prosperity</text><text x="920" y="726" font-family="Arial, sans-serif" font-size="25" fill="#59625c" font-weight="400">More productive work and local capability</text><text x="88" y="830" font-family="Arial, sans-serif" font-size="29" fill="#59625c" font-weight="400">Both paths remain exposed to demand, trade policy, utilities and execution.</text><line x1="88" y1="885" x2="1512" y2="885" stroke="#e1e6dc" stroke-width="2"/><text x="88" y="934" font-family="Arial, sans-serif" font-size="23" fill="#59625c" font-weight="400">Source: Black Scarab analysis. Sequences illustrate mechanisms, not measured causal estimates.</text></svg>