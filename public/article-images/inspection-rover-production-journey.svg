<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Inspection rover production journey</title>
  <desc id="desc">The production system evolves from ten prototypes to the first one hundred units and capacity for one thousand units per year.</desc>
  <rect width="1600" height="930" fill="#f3efe5"/>
  <text x="100" y="100" fill="#262823" font-family="Georgia, serif" font-size="52">One rover, three production systems</text>
  <text x="100" y="150" fill="#697065" font-family="Arial, sans-serif" font-size="24">Investment follows evidence as the product and demand mature</text>
  <path d="M210 465 H1390" stroke="#9aa493" stroke-width="10" stroke-linecap="round"/>
  <path d="M1360 435 L1400 465 L1360 495" fill="none" stroke="#9aa493" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(130 250)">
      <rect width="390" height="480" rx="30" fill="#343832"/>
      <text x="42" y="65" fill="#b9c3b1" font-size="24" letter-spacing="2">STAGE ONE</text>
      <text x="42" y="125" fill="#f3efe5" font-family="Georgia, serif" font-size="43">10 prototypes</text>
      <circle cx="195" cy="225" r="70" fill="#aeb9a5"/>
      <rect x="140" y="205" width="110" height="58" rx="15" fill="#343832"/>
      <circle cx="155" cy="270" r="22" fill="#b2a88f"/><circle cx="235" cy="270" r="22" fill="#b2a88f"/>
      <text x="42" y="345" fill="#f3efe5" font-size="24">Learn first</text>
      <text x="42" y="388" fill="#d3d6cf" font-size="20">Suppliers and job shops</text>
      <text x="42" y="423" fill="#d3d6cf" font-size="20">Flexible benches</text>
      <text x="42" y="458" fill="#d3d6cf" font-size="20">Intensive engineering support</text>
    </g>
    <g transform="translate(605 250)">
      <rect width="390" height="480" rx="30" fill="#aeb9a5"/>
      <text x="42" y="65" fill="#4c554b" font-size="24" letter-spacing="2">STAGE TWO</text>
      <text x="42" y="125" fill="#262823" font-family="Georgia, serif" font-size="43">First 100 units</text>
      <g transform="translate(77 170)">
        <rect width="70" height="90" rx="12" fill="#343832"/><rect x="85" width="70" height="90" rx="12" fill="#343832"/><rect x="170" width="70" height="90" rx="12" fill="#343832"/>
        <path d="M35 90 V125 M120 90 V125 M205 90 V125" stroke="#343832" stroke-width="8"/>
      </g>
      <text x="42" y="345" fill="#262823" font-size="24">Build repeatability</text>
      <text x="42" y="388" fill="#424940" font-size="20">Kits, fixtures, and records</text>
      <text x="42" y="423" fill="#424940" font-size="20">Batch subassemblies</text>
      <text x="42" y="458" fill="#424940" font-size="20">Controlled calibration and test</text>
    </g>
    <g transform="translate(1080 250)">
      <rect width="390" height="480" rx="30" fill="#b2a88f"/>
      <text x="42" y="65" fill="#555047" font-size="24" letter-spacing="2">STAGE THREE</text>
      <text x="42" y="115" fill="#262823" font-family="Georgia, serif" font-size="37">Capacity for 1,000</text>
      <text x="42" y="155" fill="#262823" font-family="Georgia, serif" font-size="29">units per year</text>
      <path d="M58 245 H330 M78 205 V285 M145 205 V285 M212 205 V285 M279 205 V285" stroke="#343832" stroke-width="9" stroke-linecap="round"/>
      <circle cx="78" cy="195" r="14" fill="#343832"/><circle cx="145" cy="195" r="14" fill="#343832"/><circle cx="212" cy="195" r="14" fill="#343832"/><circle cx="279" cy="195" r="14" fill="#343832"/>
      <text x="42" y="345" fill="#262823" font-size="24">Deliver predictably</text>
      <text x="42" y="388" fill="#47433c" font-size="20">Designed cells and roles</text>
      <text x="42" y="423" fill="#47433c" font-size="20">Managed flow and maintenance</text>
      <text x="42" y="458" fill="#47433c" font-size="20">Selective proven automation</text>
    </g>
  </g>
  <text x="100" y="860" fill="#697065" font-family="Arial, sans-serif" font-size="20">BLACK SCARAB  •  HYPOTHETICAL TEACHING EXAMPLE</text>
</svg>
