<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A practical boundary test for physical AI</title>
  <desc id="desc">Four questions distinguish physical AI from digital AI, conventional automation, and physical world analytics.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d2ab42"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#15191b"/>
  <text x="70" y="70" fill="#f7f0df" font-family="Georgia,serif" font-size="36">A practical boundary test</text>
  <text x="70" y="106" fill="#c7cec9" font-family="Arial,sans-serif" font-size="18">The machine body is not the deciding factor. The operational loop is.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(75 165)">
      <rect width="230" height="210" rx="22" fill="#f7f0df"/>
      <circle cx="34" cy="34" r="18" fill="#2457b3"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
      <text x="24" y="84" fill="#15191b" font-size="21" font-weight="700">Observe</text>
      <text x="24" y="116" fill="#515b59" font-size="16">Does the system receive</text>
      <text x="24" y="140" fill="#515b59" font-size="16">current information about</text>
      <text x="24" y="164" fill="#515b59" font-size="16">the physical world?</text>
      <text x="24" y="194" fill="#9b3b2f" font-size="14" font-weight="700">No: digital AI</text>
    </g>
    <g transform="translate(350 165)">
      <rect width="230" height="210" rx="22" fill="#efe2c5"/>
      <circle cx="34" cy="34" r="18" fill="#d24a35"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
      <text x="24" y="84" fill="#15191b" font-size="21" font-weight="700">Choose</text>
      <text x="24" y="116" fill="#515b59" font-size="16">Does a learned model</text>
      <text x="24" y="140" fill="#515b59" font-size="16">select or adapt an action</text>
      <text x="24" y="164" fill="#515b59" font-size="16">from the observed state?</text>
      <text x="24" y="194" fill="#9b3b2f" font-size="14" font-weight="700">No: fixed automation</text>
    </g>
    <g transform="translate(625 165)">
      <rect width="230" height="210" rx="22" fill="#f7f0df"/>
      <circle cx="34" cy="34" r="18" fill="#d2ab42"/>
      <text x="34" y="41" text-anchor="middle" fill="#15191b" font-size="18" font-weight="700">3</text>
      <text x="24" y="84" fill="#15191b" font-size="21" font-weight="700">Act</text>
      <text x="24" y="116" fill="#515b59" font-size="16">Can that choice change a</text>
      <text x="24" y="140" fill="#515b59" font-size="16">machine, object, process,</text>
      <text x="24" y="164" fill="#515b59" font-size="16">or governed operation?</text>
      <text x="24" y="194" fill="#9b3b2f" font-size="14" font-weight="700">No: physical analytics</text>
    </g>
    <g transform="translate(900 165)">
      <rect width="230" height="210" rx="22" fill="#d9e6df"/>
      <circle cx="34" cy="34" r="18" fill="#39705b"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text>
      <text x="24" y="84" fill="#15191b" font-size="21" font-weight="700">Verify</text>
      <text x="24" y="116" fill="#515b59" font-size="16">Does the system observe</text>
      <text x="24" y="140" fill="#515b59" font-size="16">the result and continue,</text>
      <text x="24" y="164" fill="#515b59" font-size="16">recover, or stop?</text>
      <text x="24" y="194" fill="#39705b" font-size="14" font-weight="700">Yes: the loop closes</text>
    </g>
  </g>

  <g stroke="#d2ab42" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M305 270H340"/>
    <path d="M580 270H615"/>
    <path d="M855 270H890"/>
  </g>

  <rect x="170" y="445" width="860" height="150" rx="26" fill="#2457b3"/>
  <text x="600" y="492" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="28">Black Scarab operational definition</text>
  <text x="600" y="532" text-anchor="middle" fill="#eef4ff" font-family="Arial,sans-serif" font-size="18">Physical AI observes the physical world, chooses under physical constraints,</text>
  <text x="600" y="560" text-anchor="middle" fill="#eef4ff" font-family="Arial,sans-serif" font-size="18">and causes or coordinates an action whose result can be measured in the world.</text>

  <rect x="245" y="630" width="710" height="40" rx="20" fill="#2a302f" stroke="#5e6c67"/>
  <text x="600" y="656" text-anchor="middle" fill="#d9e6df" font-family="Arial,sans-serif" font-size="15">Safety, authority, and recovery define the permitted boundary of the loop.</text>
</svg>
