  <text x="118" y="445" fill="#182019" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-5">GLOSSARY</text>
  <text x="122" y="535" fill="#596457" font-family="Arial, Helvetica, sans-serif" font-size="32">444 terms across intelligent machines</text>
