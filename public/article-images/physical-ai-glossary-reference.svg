<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">The Physical AI Glossary</title>
  <description id="description">A typographic reference cover connecting HBM, VLA, SLAM, actuator, and edge AI across the physical AI stack.</description>
  <rect width="1600" height="1000" fill="#e7eadf"/>
  <circle cx="1410" cy="120" r="310" fill="none" stroke="#cbd3c4" stroke-width="90"/>
  <circle cx="170" cy="930" r="280" fill="none" stroke="#d5d0c3" stroke-width="70"/>
  <path d="M118 128h1364" stroke="#85927e" stroke-width="2"/>
  <text x="118" y="92" fill="#485345" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="6">BLACK SCARAB REFERENCE GUIDE</text>
