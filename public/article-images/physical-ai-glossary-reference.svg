    <text x="701" y="706" text-anchor="middle" fill="#243128">SLAM</text>
    <rect x="840" y="650" width="290" height="88" rx="44" fill="#fbfaf6" stroke="#b9c2b2" stroke-width="2"/>
    <text x="985" y="706" text-anchor="middle" fill="#243128">ACTUATOR</text>
