<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">Factory build critical path</title><desc id="desc">Vertical sequence from production basis to first accepted production run.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a79a"/></marker></defs>
  <rect width="720" height="1320" rx="28" fill="#15191b"/>
  <text x="48" y="66" fill="#f6f2e8" font-family="Georgia,serif" font-size="34">The factory build critical path</text>
  <text x="48" y="102" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="17">Eight gates turn a plan into accepted output.</text>
  <path d="M104 172V890" stroke="#91a79a" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(104 172)"><circle r="34" fill="#f6f2e8"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">1</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Production basis</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Product, route, volume</text></g>
    <g transform="translate(104 274)"><circle r="34" fill="#dfe8e2"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">2</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Project baseline</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Scope, budget, schedule</text></g>
    <g transform="translate(104 376)"><circle r="34" fill="#91a79a"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">3</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Purchase</text><text x="70" y="28" fill="#b9c8bf" font-size="16">RFQ and contracts</text></g>
    <g transform="translate(104 478)"><circle r="34" fill="#f6f2e8"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">4</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Prepare site</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Permits and utilities</text></g>
    <g transform="translate(104 580)"><circle r="34" fill="#dfe8e2"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">5</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Accept at factory</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Witness FAT evidence</text></g>
    <g transform="translate(104 682)"><circle r="34" fill="#91a79a"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">6</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Install</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Place and connect</text></g>
    <g transform="translate(104 784)"><circle r="34" fill="#f6f2e8"/><text y="8" text-anchor="middle" fill="#15191b" font-size="22" font-weight="700">7</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Commission</text><text x="70" y="28" fill="#b9c8bf" font-size="16">Prove the full system</text></g>
    <g transform="translate(104 886)"><circle r="34" fill="#b16f50"/><text y="8" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">8</text><text x="70" y="0" fill="#f6f2e8" font-size="20" font-weight="700">Release</text><text x="70" y="28" fill="#b9c8bf" font-size="16">First accepted run</text></g>
  </g>
  <rect x="48" y="972" width="624" height="272" rx="24" fill="#26312d" stroke="#6f8a7a" stroke-width="2"/>
  <text x="76" y="1016" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="20" font-weight="700">Four synchronized workstreams</text>
  <g font-family="Arial,sans-serif" font-size="16"><text x="76" y="1062" fill="#dfe8e2">Facility</text><text x="220" y="1062" fill="#b9c8bf">Building and utilities</text><text x="76" y="1106" fill="#dfe8e2">Equipment</text><text x="220" y="1106" fill="#b9c8bf">Build, test, install</text><text x="76" y="1150" fill="#dfe8e2">Operations</text><text x="220" y="1150" fill="#b9c8bf">People, quality, material</text><text x="76" y="1194" fill="#dfe8e2">Cash and risk</text><text x="220" y="1194" fill="#b9c8bf">Payments and contingency</text></g>
  <text x="360" y="1282" text-anchor="middle" fill="#91a79a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Opening requires all four workstreams to be ready.</text>
</svg>
