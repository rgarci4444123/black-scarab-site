<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">Factory build critical path</title><desc id="desc">Eight factory launch gates in a vertical sequence with four synchronized workstreams.</desc>
  <rect width="720" height="1120" rx="28" fill="#f6f2e8"/>
  <text x="44" y="64" fill="#15191b" font-family="Georgia,serif" font-size="34">The factory build critical path</text>
  <text x="44" y="100" fill="#56605b" font-family="Arial,sans-serif" font-size="17">Eight gates from production basis to accepted output.</text>
  <line x1="82" y1="172" x2="82" y2="820" stroke="#91a79a" stroke-width="4"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(82 176)"><circle r="28" fill="#15191b"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">01</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Production basis</text><text x="52" y="24" fill="#56605b" font-size="16">Release product, route, volume, and quality</text></g>
    <g transform="translate(82 268)"><circle r="28" fill="#6f8a7a"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">02</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Project baseline</text><text x="52" y="24" fill="#56605b" font-size="16">Approve scope, owners, budget, and schedule</text></g>
    <g transform="translate(82 360)"><circle r="28" fill="#52675c"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">03</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Purchase</text><text x="52" y="24" fill="#56605b" font-size="16">Issue RFQs with acceptance and support terms</text></g>
    <g transform="translate(82 452)"><circle r="28" fill="#15191b"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">04</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Prepare site</text><text x="52" y="24" fill="#56605b" font-size="16">Complete permits, access, utilities, and safety</text></g>
    <g transform="translate(82 544)"><circle r="28" fill="#15191b"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">05</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Factory test</text><text x="52" y="24" fill="#56605b" font-size="16">Witness FAT and record open exceptions</text></g>
    <g transform="translate(82 636)"><circle r="28" fill="#6f8a7a"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">06</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Install</text><text x="52" y="24" fill="#56605b" font-size="16">Receive, place, connect, and control changes</text></g>
    <g transform="translate(82 728)"><circle r="28" fill="#52675c"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">07</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Commission</text><text x="52" y="24" fill="#56605b" font-size="16">Prove safety, flow, recovery, and records</text></g>
    <g transform="translate(82 820)"><circle r="28" fill="#b96f4d"/><text y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">08</text><text x="52" y="-3" fill="#15191b" font-size="21" font-weight="700">Release</text><text x="52" y="24" fill="#56605b" font-size="16">Approve the first accepted production run</text></g>
  </g>
  <rect x="44" y="890" width="632" height="174" rx="20" fill="#15191b"/>
  <text x="70" y="930" fill="#f6f2e8" font-family="Arial,sans-serif" font-size="18" font-weight="700">FOUR WORKSTREAMS MOVE TOGETHER</text>
  <g font-family="Arial,sans-serif" font-size="16"><text x="70" y="972" fill="#91a79a">FACILITY</text><text x="190" y="972" fill="#d7e0da">Building and utilities</text><text x="70" y="1004" fill="#91a79a">EQUIPMENT</text><text x="190" y="1004" fill="#d7e0da">Build, test, and install</text><text x="390" y="972" fill="#91a79a">OPERATIONS</text><text x="520" y="972" fill="#d7e0da">People and quality</text><text x="390" y="1004" fill="#91a79a">CASH</text><text x="520" y="1004" fill="#d7e0da">Risk and runway</text></g>
  <text x="360" y="1046" text-anchor="middle" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="15">Opening day is a system readiness decision.</text>
</svg>
