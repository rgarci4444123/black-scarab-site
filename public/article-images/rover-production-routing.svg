<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The production route changes with volume</title>
  <desc id="desc">Comparison of flexible prototype work, a controlled pilot cell, and parallel stations for annual capacity of one thousand hypothetical rovers.</desc>
  <rect width="1600" height="1000" fill="#f4f0e8"/>
  <rect x="50" y="50" width="1500" height="900" rx="34" fill="#fffdfa" stroke="#d9d4c9" stroke-width="2"/>
  <text x="100" y="125" fill="#18201d" font-family="Georgia, serif" font-size="48" font-weight="700">The production route changes with volume</text>
  <text x="100" y="170" fill="#667069" font-family="Arial, sans-serif" font-size="23">Flexibility buys learning first, then controlled flow and parallel work create repeatable capacity</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="100" y="230" width="420" height="585" rx="28" fill="#edf2ec" stroke="#cdd7cb"/>
      <text x="135" y="285" fill="#18201d" font-size="29" font-weight="700">10 prototypes</text>
      <text x="135" y="322" fill="#667069" font-size="20">Flexible project route</text>
      <g fill="#fffdfa" stroke="#d9dfd5"><rect x="135" y="370" width="350" height="68" rx="14"/><rect x="135" y="470" width="350" height="68" rx="14"/><rect x="135" y="570" width="350" height="68" rx="14"/><rect x="135" y="670" width="350" height="68" rx="14"/></g>
      <g fill="#34413b" font-size="20"><text x="165" y="412">Build and modify</text><text x="165" y="512">Debug interfaces</text><text x="165" y="612">Record redlines and failures</text><text x="165" y="712">Correct the product definition</text></g>
      <text x="135" y="780" fill="#5c6e60" font-size="18" font-weight="700">PRIMARY OUTPUT  |  KNOWLEDGE</text>
    </g>
    <g>
      <rect x="590" y="230" width="420" height="585" rx="28" fill="#f2e8dc" stroke="#dec7ad"/>
      <text x="625" y="285" fill="#18201d" font-size="29" font-weight="700">100 commercial units</text>
      <text x="625" y="322" fill="#667069" font-size="20">Controlled pilot cell</text>
      <g fill="#fffdfa" stroke="#e4d4c2"><rect x="625" y="370" width="350" height="68" rx="14"/><rect x="625" y="470" width="350" height="68" rx="14"/><rect x="625" y="570" width="350" height="68" rx="14"/><rect x="625" y="670" width="350" height="68" rx="14"/></g>
      <g fill="#34413b" font-size="20"><text x="655" y="412">Release small batches</text><text x="655" y="512">Train repeatable work</text><text x="655" y="612">Capture quality and traceability</text><text x="655" y="712">Control every change</text></g>
      <text x="625" y="780" fill="#8a603d" font-size="18" font-weight="700">PRIMARY OUTPUT  |  REPEATABILITY</text>
    </g>
    <g>
      <rect x="1080" y="230" width="420" height="585" rx="28" fill="#1a211e"/>
      <text x="1115" y="285" fill="#f8f6f0" font-size="29" font-weight="700">1,000 unit capacity</text>
      <text x="1115" y="322" fill="#bcc8bf" font-size="20">Balanced parallel stations</text>
      <g fill="#303b36"><rect x="1115" y="370" width="350" height="68" rx="14"/><rect x="1115" y="470" width="350" height="68" rx="14"/><rect x="1115" y="570" width="350" height="68" rx="14"/><rect x="1115" y="670" width="350" height="68" rx="14"/></g>
      <g fill="#f7f4ed" font-size="20"><text x="1145" y="412">105 minutes of takt</text><text x="1145" y="512">515 minutes of direct work</text><text x="1145" y="612">Longest station 100 minutes</text><text x="1145" y="712">Capacity reserve absorbs losses</text></g>
      <text x="1115" y="780" fill="#d6a56f" font-size="18" font-weight="700">PRIMARY OUTPUT  |  CAPACITY</text>
    </g>
    <path d="M520 520 H575" stroke="#8c9c8a" stroke-width="5"/><polygon points="575,520 552,506 552,534" fill="#8c9c8a"/>
    <path d="M1010 520 H1065" stroke="#c58f5f" stroke-width="5"/><polygon points="1065,520 1042,506 1042,534" fill="#c58f5f"/>
    <rect x="100" y="850" width="1400" height="55" rx="13" fill="#18201d"/>
    <text x="125" y="884" fill="#f6f4ef" font-size="18">ILLUSTRATIVE PLANNING ASSUMPTIONS  |  Real capacity requires measured cycles, availability, yield, staffing, material, and product mix</text>
  </g>
</svg>
