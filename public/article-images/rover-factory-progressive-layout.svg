<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Progressive rover factory layout</title>
  <desc id="desc">Three illustrative floor plans show how rover production progresses from 10 prototypes to 100 commercial units and capacity for 1,000 units annually.</desc>
  <rect width="1800" height="1120" fill="#f5f0e6"/>
  <text x="90" y="90" fill="#1d2420" font-family="Arial, sans-serif" font-size="48" font-weight="700">One product, three production stages</text>
  <text x="90" y="140" fill="#69716b" font-family="Arial, sans-serif" font-size="24">The layout becomes more controlled as evidence and volume grow</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 205)">
      <rect width="520" height="760" rx="26" fill="#fffdf7" stroke="#627169" stroke-width="4"/>
      <text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">First 10 prototypes</text><text x="35" y="88" fill="#6b746e" font-size="19">Flexible engineering workshop</text>
      <rect x="35" y="125" width="180" height="105" rx="14" fill="#dbe4de"/><text x="125" y="173" text-anchor="middle" fill="#26312c" font-size="20" font-weight="700">Parts and tools</text><text x="125" y="201" text-anchor="middle" fill="#56645d" font-size="16">Project bins</text>
      <rect x="250" y="125" width="235" height="105" rx="14" fill="#eadfc9"/><text x="367" y="173" text-anchor="middle" fill="#26312c" font-size="20" font-weight="700">Shared engineering</text><text x="367" y="201" text-anchor="middle" fill="#56645d" font-size="16">Design and records</text>
      <rect x="35" y="275" width="210" height="150" rx="14" fill="#8da196"/><text x="140" y="337" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Build bench A</text><text x="140" y="369" text-anchor="middle" fill="#f5f7f5" font-size="16">Mechanical work</text>
      <rect x="275" y="275" width="210" height="150" rx="14" fill="#8da196"/><text x="380" y="337" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Build bench B</text><text x="380" y="369" text-anchor="middle" fill="#f5f7f5" font-size="16">Electrical work</text>
      <rect x="35" y="475" width="210" height="150" rx="14" fill="#34413b"/><text x="140" y="537" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Software and</text><text x="140" y="568" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">calibration</text>
      <rect x="275" y="475" width="210" height="150" rx="14" fill="#b77a4a"/><text x="380" y="537" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Safe test area</text><text x="380" y="568" text-anchor="middle" fill="#fff" font-size="16">Fault learning</text>
      <path d="M125 230 V260 H140 V275 M245 350 H275 M380 425 V460 H245 V475 M380 625 V670 H260" fill="none" stroke="#c79a56" stroke-width="7" marker-end="url(#a)"/>
      <text x="35" y="710" fill="#6b746e" font-size="18">Priority: learn the route and stabilize the design</text>
    </g>
    <g transform="translate(640 205)">
      <rect width="520" height="760" rx="26" fill="#fffdf7" stroke="#627169" stroke-width="4"/>
      <text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">First 100 units</text><text x="35" y="88" fill="#6b746e" font-size="19">Controlled commercial cell</text>
      <rect x="35" y="125" width="140" height="110" rx="14" fill="#dbe4de"/><text x="105" y="170" text-anchor="middle" fill="#26312c" font-size="18" font-weight="700">Receiving</text><text x="105" y="197" text-anchor="middle" fill="#56645d" font-size="15">and quality</text>
      <rect x="205" y="125" width="140" height="110" rx="14" fill="#eadfc9"/><text x="275" y="170" text-anchor="middle" fill="#26312c" font-size="18" font-weight="700">Storage</text><text x="275" y="197" text-anchor="middle" fill="#56645d" font-size="15">and hold</text>
      <rect x="375" y="125" width="110" height="110" rx="14" fill="#dbe4de"/><text x="430" y="170" text-anchor="middle" fill="#26312c" font-size="18" font-weight="700">Kitting</text>
      <rect x="35" y="285" width="450" height="210" rx="18" fill="#8da196"/><text x="260" y="325" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Mixed rover assembly cell</text>
      <rect x="65" y="355" width="110" height="100" rx="12" fill="#f8f4ea"/><text x="120" y="399" text-anchor="middle" fill="#26312c" font-size="16" font-weight="700">Mechanical</text><text x="120" y="425" text-anchor="middle" fill="#56645d" font-size="14">Station 1</text>
      <rect x="205" y="355" width="110" height="100" rx="12" fill="#f8f4ea"/><text x="260" y="399" text-anchor="middle" fill="#26312c" font-size="16" font-weight="700">Electrical</text><text x="260" y="425" text-anchor="middle" fill="#56645d" font-size="14">Station 2</text>
      <rect x="345" y="355" width="110" height="100" rx="12" fill="#f8f4ea"/><text x="400" y="399" text-anchor="middle" fill="#26312c" font-size="16" font-weight="700">Configure</text><text x="400" y="425" text-anchor="middle" fill="#56645d" font-size="14">Station 3</text>
      <rect x="35" y="545" width="215" height="110" rx="14" fill="#34413b"/><text x="142" y="592" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Calibration and test</text><text x="142" y="620" text-anchor="middle" fill="#dce4de" font-size="15">Recorded results</text>
      <rect x="280" y="545" width="205" height="110" rx="14" fill="#b77a4a"/><text x="382" y="592" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Pack and ship</text><text x="382" y="620" text-anchor="middle" fill="#f8ede5" font-size="15">Released product</text>
      <path d="M175 180 H195 M345 180 H365 M430 235 V270 H260 V285 M120 495 V530 H142 V545 M250 600 H270" fill="none" stroke="#c79a56" stroke-width="7"/>
      <text x="35" y="710" fill="#6b746e" font-size="18">Priority: make every build repeatable and traceable</text>
    </g>
    <g transform="translate(1210 205)">
      <rect width="520" height="760" rx="26" fill="#fffdf7" stroke="#627169" stroke-width="4"/>
      <text x="35" y="55" fill="#1d2420" font-size="29" font-weight="700">Capacity for 1,000</text><text x="35" y="88" fill="#6b746e" font-size="19">Repeatable flow with expansion</text>
      <rect x="35" y="125" width="135" height="120" rx="14" fill="#dbe4de"/><text x="102" y="173" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Inbound</text><text x="102" y="199" text-anchor="middle" fill="#56645d" font-size="14">Quality and hold</text>
      <rect x="195" y="125" width="140" height="120" rx="14" fill="#eadfc9"/><text x="265" y="173" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Supermarket</text><text x="265" y="199" text-anchor="middle" fill="#56645d" font-size="14">Kit route</text>
      <rect x="360" y="125" width="125" height="120" rx="14" fill="#dbe4de"/><text x="422" y="173" text-anchor="middle" fill="#26312c" font-size="17" font-weight="700">Support</text><text x="422" y="199" text-anchor="middle" fill="#56645d" font-size="14">Quality and tools</text>
      <rect x="35" y="285" width="450" height="145" rx="18" fill="#8da196"/><text x="260" y="327" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Assembly cell 1</text><text x="260" y="360" text-anchor="middle" fill="#f5f7f5" font-size="16">Balanced mechanical, electrical, and configuration work</text><path d="M75 392 H445" stroke="#f5f0e6" stroke-width="9" stroke-dasharray="28 14"/>
      <rect x="35" y="470" width="210" height="120" rx="14" fill="#34413b"/><text x="140" y="518" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Calibration and test</text><text x="140" y="546" text-anchor="middle" fill="#dce4de" font-size="15">Parallel fixtures</text>
      <rect x="275" y="470" width="210" height="120" rx="14" fill="#b77a4a"/><text x="380" y="518" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Pack and outbound</text><text x="380" y="546" text-anchor="middle" fill="#f8ede5" font-size="15">Finished goods</text>
      <rect x="35" y="625" width="450" height="75" rx="14" fill="none" stroke="#7f9589" stroke-width="4" stroke-dasharray="12 10"/><text x="260" y="672" text-anchor="middle" fill="#60736a" font-size="19" font-weight="700">Reserved bay for cell 2 or added test capacity</text>
      <path d="M170 185 H185 M335 185 H350 M422 245 V270 H260 V285 M140 430 V460 M245 530 H265" fill="none" stroke="#c79a56" stroke-width="7"/>
      <text x="35" y="735" fill="#6b746e" font-size="18">Priority: predictable output and practical growth</text>
    </g>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#c79a56"/></marker></defs>
  <text x="900" y="1050" text-anchor="middle" fill="#69716b" font-family="Arial, sans-serif" font-size="20">Illustrative relationships only. Real dimensions follow equipment, flow, access, utility, safety, code, and site evidence.</text>
</svg>
