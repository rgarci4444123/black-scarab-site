<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1640" viewBox="0 0 900 1640" role="img" aria-labelledby="title desc">
  <title id="title">Production order to production record</title><desc id="desc">Vertical mobile diagram of seven stages from enterprise plan to completed production record.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#667268"/></marker><style>.e{font:600 16px Arial;letter-spacing:2px;fill:#798078}.t{font:700 39px Georgia;fill:#242722}.n{font:700 23px Arial;fill:#252824}.b{font:400 17px Arial;fill:#555b55}.s{font:600 14px Arial;fill:#657168}.ln{stroke:#667268;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="900" height="1640" fill="#f3efe4"/><text x="55" y="70" class="e">ROVER ORDER R1042 · ILLUSTRATIVE</text><text x="55" y="125" class="t">Order to evidence</text><text x="55" y="163" class="b">One identity follows the work through every layer.</text>
  <g><rect x="120" y="215" width="660" height="130" rx="18" fill="#eee8da" stroke="#9f988b" stroke-width="2"/><text x="155" y="255" class="s">01 · PLAN</text><text x="155" y="300" class="n">Enterprise · Build one rover, revision C</text>
  <rect x="120" y="385" width="660" height="130" rx="18" fill="#e4eadf" stroke="#879681" stroke-width="2"/><text x="155" y="425" class="s">02 · DISPATCH</text><text x="155" y="470" class="n">MES · Release route and identity</text>
  <rect x="120" y="555" width="660" height="130" rx="18" fill="#dce6da" stroke="#7d8e7e" stroke-width="2"/><text x="155" y="595" class="s">03 · CONFIGURE</text><text x="155" y="640" class="n">Cell · Verify program, tool, and recipe</text>
  <rect x="120" y="725" width="660" height="130" rx="18" fill="#cad9c9" stroke="#6f8270" stroke-width="2"/><text x="155" y="765" class="s">04 · CONTROL</text><text x="155" y="810" class="n">PLC and devices · Run the sequence</text>
  <rect x="120" y="895" width="660" height="130" rx="18" fill="#2d322e"/><text x="155" y="935" class="s" style="fill:#d9ded9">05 · ACT</text><text x="155" y="980" class="n" style="fill:#f7f2e8">Physical work · Clamp, move, tighten, test</text>
  <rect x="120" y="1065" width="660" height="130" rx="18" fill="#dce6da" stroke="#7d8e7e" stroke-width="2"/><text x="155" y="1105" class="s">06 · VERIFY</text><text x="155" y="1150" class="n">Quality · Value, limits, pass or fail</text>
  <rect x="120" y="1235" width="660" height="130" rx="18" fill="#eee8da" stroke="#9f988b" stroke-width="2"/><text x="155" y="1275" class="s">07 · COMPLETE</text><text x="155" y="1320" class="n">Record · Genealogy and inventory status</text></g>
  <path d="M450 345V375M450 515V545M450 685V715M450 855V885M450 1025V1055M450 1195V1225" class="ln"/>
  <rect x="120" y="1430" width="660" height="135" rx="18" fill="#fbf8ef" stroke="#9aa39a" stroke-width="2"/><text x="155" y="1470" class="s">CONTEXT THAT SURVIVES</text><text x="155" y="1510" class="b">Identity · revision · material · program · value</text><text x="155" y="1542" class="b">Unit · limit · quality · time · source · disposition</text>
</svg>
