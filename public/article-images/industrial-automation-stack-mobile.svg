<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Industrial automation stack</title><desc id="desc">Vertical mobile view of enterprise, operations, supervision, control, field, and physical production layers.</desc>
  <style>.e{font:600 16px Arial;letter-spacing:2px;fill:#798078}.t{font:700 40px Georgia;fill:#242722}.n{font:700 24px Arial;fill:#252824}.b{font:400 18px Arial;fill:#555b55}.s{font:600 14px Arial;fill:#657168}</style><rect width="900" height="1500" fill="#f3efe4"/><text x="55" y="72" class="e">AUTOMATION ARCHITECTURE</text><text x="55" y="126" class="t">A factory is layered</text><text x="55" y="164" class="b">Responsibility and time horizon change by layer.</text>
  <g><rect x="80" y="225" width="740" height="150" rx="18" fill="#eee8da" stroke="#a7a092" stroke-width="2"/><text x="120" y="270" class="n">Enterprise planning</text><text x="120" y="308" class="b">ERP · demand · supply · orders · finance</text><text x="120" y="342" class="s">DAYS TO MONTHS</text>
  <rect x="80" y="400" width="740" height="150" rx="18" fill="#e4eadf" stroke="#879681" stroke-width="2"/><text x="120" y="445" class="n">Manufacturing operations</text><text x="120" y="483" class="b">MES · quality · maintenance · warehouse</text><text x="120" y="517" class="s">MINUTES TO DAYS</text>
  <rect x="80" y="575" width="740" height="150" rx="18" fill="#d8e2d6" stroke="#788978" stroke-width="2"/><text x="120" y="620" class="n">Supervision</text><text x="120" y="658" class="b">HMI · SCADA · alarms · historian</text><text x="120" y="692" class="s">SECONDS TO HOURS</text>
  <rect x="80" y="750" width="740" height="150" rx="18" fill="#c9d7c8" stroke="#6d806e" stroke-width="2"/><text x="120" y="795" class="n">Control and safety</text><text x="120" y="833" class="b">PLC · CNC · robot · motion · safety</text><text x="120" y="867" class="s">MICROSECONDS TO SECONDS</text>
  <rect x="80" y="925" width="740" height="150" rx="18" fill="#b9cab9" stroke="#637765" stroke-width="2"/><text x="120" y="970" class="n">Sensing and action</text><text x="120" y="1008" class="b">Sensors · I/O · drives · motors · valves</text><text x="120" y="1042" class="s">CONTINUOUS MACHINE TIME</text>
  <rect x="80" y="1100" width="740" height="150" rx="18" fill="#2d322e"/><text x="120" y="1145" class="n" style="fill:#f7f2e8">Physical production</text><text x="120" y="1183" class="b" style="fill:#d8ddd8">Material · machine · fixture · tool · rover</text><text x="120" y="1217" class="s" style="fill:#d8ddd8">THE REAL WORLD</text></g>
  <text x="80" y="1325" class="b">↓ Authorized work and commands</text><text x="80" y="1370" class="b">↑ State, results, context, and evidence</text><text x="80" y="1440" class="s">INFORMED BY THE ISA 95 ACTIVITY MODEL</text>
</svg>
