<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1900" viewBox="0 0 900 1900" role="img" aria-labelledby="title desc">
  <title id="title">Factory utility dependency map</title>
  <desc id="desc">Production loads connect through a controlled utility architecture to plant sources.</desc>
  <rect width="900" height="1900" fill="#f5f0e6"/>
  <text x="60" y="80" fill="#1d2420" font-family="Arial, sans-serif" font-size="40" font-weight="700">Utilities are production inputs</text><text x="60" y="124" fill="#69716b" font-family="Arial, sans-serif" font-size="21">Design from each load back to the source</text>
  <g font-family="Arial, sans-serif">
    <text x="450" y="195" text-anchor="middle" fill="#6a716c" font-size="21" font-weight="700">PRODUCTION LOADS</text>
    <g fill="#fffdf7" stroke="#7f9589" stroke-width="3"><rect x="70" y="225" width="230" height="95" rx="16"/><rect x="335" y="225" width="230" height="95" rx="16"/><rect x="600" y="225" width="230" height="95" rx="16"/><rect x="200" y="350" width="230" height="95" rx="16"/><rect x="470" y="350" width="230" height="95" rx="16"/></g>
    <g fill="#1d2420" font-size="17" font-weight="700" text-anchor="middle"><text x="185" y="282">Assembly</text><text x="450" y="282">Calibration and test</text><text x="715" y="282">Material movement</text><text x="315" y="407">Quality laboratory</text><text x="585" y="407">People and building</text></g>
    <path d="M450 465 V535" stroke="#c79a56" stroke-width="7"/>
    <rect x="70" y="535" width="760" height="650" rx="30" fill="#34413b"/><text x="450" y="590" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Utility architecture</text>
    <g fill="#f7f4ed"><rect x="115" y="635" width="300" height="115" rx="16"/><rect x="485" y="635" width="300" height="115" rx="16"/><rect x="115" y="785" width="300" height="115" rx="16"/><rect x="485" y="785" width="300" height="115" rx="16"/><rect x="115" y="935" width="300" height="115" rx="16"/><rect x="485" y="935" width="300" height="115" rx="16"/><rect x="115" y="1080" width="670" height="70" rx="16"/></g>
    <g fill="#26312c" text-anchor="middle"><text x="265" y="682" font-size="19" font-weight="700">Distribution</text><text x="265" y="713" font-size="15">Panels, pipes, ducts, paths</text><text x="635" y="682" font-size="19" font-weight="700">Quality</text><text x="635" y="713" font-size="15">Pressure, voltage, temperature</text><text x="265" y="832" font-size="19" font-weight="700">Isolation</text><text x="265" y="863" font-size="15">Safe local and plant control</text><text x="635" y="832" font-size="19" font-weight="700">Monitoring</text><text x="635" y="863" font-size="15">Load, condition, alarm, history</text><text x="265" y="982" font-size="19" font-weight="700">Maintenance</text><text x="265" y="1013" font-size="15">Access, spares, recovery</text><text x="635" y="982" font-size="19" font-weight="700">Resilience</text><text x="635" y="1013" font-size="15">Failure and restart plan</text><text x="450" y="1124" font-size="18" font-weight="700">Growth capacity and reserved connections</text></g>
    <path d="M450 1185 V1255" stroke="#c79a56" stroke-width="7"/>
    <text x="450" y="1315" text-anchor="middle" fill="#6a716c" font-size="21" font-weight="700">PLANT SOURCES</text>
    <g fill="#fffdf7" stroke="#b77a4a" stroke-width="3"><rect x="70" y="1345" width="230" height="95" rx="16"/><rect x="335" y="1345" width="230" height="95" rx="16"/><rect x="600" y="1345" width="230" height="95" rx="16"/><rect x="200" y="1470" width="230" height="95" rx="16"/><rect x="470" y="1470" width="230" height="95" rx="16"/></g>
    <g fill="#1d2420" font-size="17" font-weight="700" text-anchor="middle"><text x="185" y="1402">Power and backup</text><text x="450" y="1402">Air, gas, vacuum</text><text x="715" y="1402">Water and cooling</text><text x="315" y="1527">Ventilation and exhaust</text><text x="585" y="1516">Data and</text><text x="585" y="1541">safety systems</text></g>
    <rect x="105" y="1645" width="690" height="135" rx="20" fill="#7f9589"/><text x="450" y="1693" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Verify normal, peak, service, failure,</text><text x="450" y="1727" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">restart, and expansion conditions</text>
  </g>
</svg>
