<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Factory design sequence</title>
  <desc id="desc">Nine connected stages move from product definition through process, capacity, layout, utilities, site selection, validation, and expansion.</desc>
  <rect width="1800" height="1000" fill="#f5f0e6"/>
  <text x="100" y="105" fill="#1d2420" font-family="Arial, sans-serif" font-size="48" font-weight="700">Design the production system before the building</text>
  <text x="100" y="155" fill="#69716b" font-family="Arial, sans-serif" font-size="24">Each gate creates evidence for the next decision and can send the design back for revision</text>
  <path d="M230 345 H1570" stroke="#a8b2aa" stroke-width="8" stroke-linecap="round"/>
  <path d="M1570 345 C1660 345 1660 720 1570 720 H230 C140 720 140 345 230 345" fill="none" stroke="#a8b2aa" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(90 230)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Product</text><text x="32" y="142" fill="#5f6862" font-size="19">Variants and acceptance</text><text x="32" y="173" fill="#5f6862" font-size="19">Quality and traceability</text><text x="32" y="204" fill="#5f6862" font-size="19">Expected change</text></g>
    <g transform="translate(440 230)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Demand</text><text x="32" y="142" fill="#5f6862" font-size="19">Volume and mix</text><text x="32" y="173" fill="#5f6862" font-size="19">Calendar and service</text><text x="32" y="204" fill="#5f6862" font-size="19">Base and stress cases</text></g>
    <g transform="translate(790 230)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Route</text><text x="32" y="142" fill="#5f6862" font-size="19">Operations and quality</text><text x="32" y="173" fill="#5f6862" font-size="19">Rework and information</text><text x="32" y="204" fill="#5f6862" font-size="19">Make versus buy</text></g>
    <g transform="translate(1140 230)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Capacity</text><text x="32" y="142" fill="#5f6862" font-size="19">People and equipment</text><text x="32" y="173" fill="#5f6862" font-size="19">Buffers and uptime</text><text x="32" y="204" fill="#5f6862" font-size="19">Constraint model</text></g>
    <g transform="translate(1410 570)"><rect width="300" height="230" rx="24" fill="#34413b"/><circle cx="48" cy="48" r="25" fill="#d5b47a"/><text x="48" y="57" text-anchor="middle" fill="#1d2420" font-size="24" font-weight="700">5</text><text x="32" y="105" fill="#fffdf7" font-size="25" font-weight="700">Flow and layout</text><text x="32" y="142" fill="#dce4de" font-size="19">Relationships and routes</text><text x="32" y="173" fill="#dce4de" font-size="19">Storage and support</text><text x="32" y="204" fill="#dce4de" font-size="19">Alternative concepts</text></g>
    <g transform="translate(1060 570)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">6</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Utilities</text><text x="32" y="142" fill="#5f6862" font-size="19">Loads and connections</text><text x="32" y="173" fill="#5f6862" font-size="19">Isolation and service</text><text x="32" y="204" fill="#5f6862" font-size="19">Growth capacity</text></g>
    <g transform="translate(710 570)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">7</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Site</text><text x="32" y="142" fill="#5f6862" font-size="19">Building and land</text><text x="32" y="173" fill="#5f6862" font-size="19">Permits and resilience</text><text x="32" y="204" fill="#5f6862" font-size="19">Complete economics</text></g>
    <g transform="translate(360 570)"><rect width="300" height="230" rx="24" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><circle cx="48" cy="48" r="25" fill="#34413b"/><text x="48" y="57" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">8</text><text x="32" y="105" fill="#1d2420" font-size="25" font-weight="700">Validation</text><text x="32" y="142" fill="#5f6862" font-size="19">Safety and code</text><text x="32" y="173" fill="#5f6862" font-size="19">Simulation and access</text><text x="32" y="204" fill="#5f6862" font-size="19">Operating review</text></g>
    <g transform="translate(90 570)"><rect width="220" height="230" rx="24" fill="#7f9589"/><circle cx="48" cy="48" r="25" fill="#f5f0e6"/><text x="48" y="57" text-anchor="middle" fill="#1d2420" font-size="24" font-weight="700">9</text><text x="32" y="105" fill="#fff" font-size="25" font-weight="700">Phases</text><text x="32" y="142" fill="#f2f5f3" font-size="18">Launch plan</text><text x="32" y="173" fill="#f2f5f3" font-size="18">Expansion triggers</text><text x="32" y="204" fill="#f2f5f3" font-size="18">Change control</text></g>
    <path d="M900 825 C900 900 520 900 520 825" fill="none" stroke="#b77a4a" stroke-width="5" stroke-dasharray="12 12"/>
    <text x="900" y="930" text-anchor="middle" fill="#875633" font-size="21" font-weight="700">Feedback before commitment is cheaper than correction after installation</text>
  </g>
</svg>
