<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Four production ownership models</title>
  <desc id="desc">A structured comparison of prototype workshop, minimum viable factory, conventional small plant, and selective smart factory.</desc>
  <rect width="1600" height="1000" rx="36" fill="#15191b"/>
  <text x="88" y="92" fill="#f6f2e8" font-family="Georgia,serif" font-size="48">Four ways to own production capability</text>
  <text x="88" y="134" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="22">Choose the smallest operating model that protects the product promise.</text>
  <g font-family="Arial,sans-serif">
    <rect x="88" y="190" width="1424" height="82" rx="16" fill="#26312d"/>
    <text x="126" y="240" fill="#91a79a" font-size="18" font-weight="700" letter-spacing="2">MODEL</text><text x="490" y="240" fill="#91a79a" font-size="18" font-weight="700" letter-spacing="2">WHAT IT OWNS</text><text x="900" y="240" fill="#91a79a" font-size="18" font-weight="700" letter-spacing="2">USE IT WHEN</text><text x="1250" y="240" fill="#91a79a" font-size="18" font-weight="700" letter-spacing="2">WATCH FOR</text>
    <rect x="88" y="286" width="1424" height="142" rx="18" fill="#f6f2e8"/>
    <circle cx="132" cy="332" r="24" fill="#15191b"/><text x="132" y="340" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">1</text><text x="174" y="328" fill="#15191b" font-size="25" font-weight="700">Prototype workshop</text><text x="174" y="363" fill="#6f8a7a" font-size="18" font-weight="700">Learn before scaling</text><text x="490" y="328" fill="#414b46" font-size="19">Engineering builds and flexible tools</text><text x="490" y="360" fill="#66706b" font-size="17">Outside fabrication and shared space</text><text x="900" y="328" fill="#414b46" font-size="19">Design and demand still move</text><text x="900" y="360" fill="#66706b" font-size="17">Learning matters more than utilization</text><text x="1250" y="328" fill="#414b46" font-size="19">Informal process</text><text x="1250" y="360" fill="#66706b" font-size="17">Habits can harden early</text>
    <rect x="88" y="444" width="1424" height="142" rx="18" fill="#e2ebe5"/>
    <circle cx="132" cy="490" r="24" fill="#6f8a7a"/><text x="132" y="498" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">2</text><text x="174" y="486" fill="#15191b" font-size="25" font-weight="700">Minimum viable factory</text><text x="174" y="521" fill="#52675c" font-size="18" font-weight="700">Control the critical steps</text><text x="490" y="486" fill="#344239" font-size="19">Final assembly, test, and genealogy</text><text x="490" y="518" fill="#526158" font-size="17">Selective fixtures in a dedicated bay</text><text x="900" y="486" fill="#344239" font-size="19">Early commercial volume matters</text><text x="900" y="518" fill="#526158" font-size="17">Product knowledge is still forming</text><text x="1250" y="486" fill="#344239" font-size="19">Thin support</text><text x="1250" y="518" fill="#526158" font-size="17">Key people become bottlenecks</text>
    <rect x="88" y="602" width="1424" height="142" rx="18" fill="#9caf9f"/>
    <circle cx="132" cy="648" r="24" fill="#26312d"/><text x="132" y="656" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">3</text><text x="174" y="644" fill="#15191b" font-size="25" font-weight="700">Conventional small plant</text><text x="174" y="679" fill="#26312d" font-size="18" font-weight="700">Repeat with discipline</text><text x="490" y="644" fill="#26312d" font-size="19">Dedicated flow, equipment, and support</text><text x="490" y="676" fill="#344239" font-size="17">Supervision, quality, and maintenance</text><text x="900" y="644" fill="#26312d" font-size="19">Demand and process are stable</text><text x="900" y="676" fill="#344239" font-size="17">Capacity can earn its fixed cost</text><text x="1250" y="644" fill="#26312d" font-size="19">Idle assets</text><text x="1250" y="676" fill="#344239" font-size="17">Fixed cost can outrun orders</text>
    <rect x="88" y="760" width="1424" height="142" rx="18" fill="#26312d" stroke="#91a79a" stroke-width="2"/>
    <circle cx="132" cy="806" r="24" fill="#b96f4d"/><text x="132" y="814" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">4</text><text x="174" y="802" fill="#f6f2e8" font-size="25" font-weight="700">Selective smart factory</text><text x="174" y="837" fill="#91a79a" font-size="18" font-weight="700">Adapt where value is proven</text><text x="490" y="802" fill="#e1e8e3" font-size="19">Connected records and bounded cells</text><text x="490" y="834" fill="#b9c8bf" font-size="17">Vision and guided adaptive work</text><text x="900" y="802" fill="#e1e8e3" font-size="19">Variation has a measured cost</text><text x="900" y="834" fill="#b9c8bf" font-size="17">Evidence supports more authority</text><text x="1250" y="802" fill="#e1e8e3" font-size="19">Integration debt</text><text x="1250" y="834" fill="#b9c8bf" font-size="17">Complexity can exceed payoff</text>
  </g>
  <line x1="88" y1="944" x2="1425" y2="944" stroke="#6f8a7a" stroke-width="3"/><path d="M1425 932L1450 944L1425 956Z" fill="#6f8a7a"/><text x="88" y="972" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="17">LESS FIXED CAPACITY</text><text x="1512" y="972" text-anchor="end" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="17">MORE OWNED CAPABILITY</text>
</svg>
