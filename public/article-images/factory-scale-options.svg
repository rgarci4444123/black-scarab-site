<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Four factory scale options</title><desc id="desc">Comparison of prototype workshop, minimum viable factory, conventional small plant, and selective smart factory.</desc>
  <rect width="1200" height="700" rx="28" fill="#15191b"/>
  <text x="64" y="68" fill="#f6f2e8" font-family="Georgia,serif" font-size="36">Four ways to own production capability</text>
  <text x="64" y="105" fill="#b9c8bf" font-family="Arial,sans-serif" font-size="18">The right factory is the smallest system that can protect the product promise and support demand.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(54 154)"><rect width="260" height="428" rx="22" fill="#f6f2e8"/><text x="24" y="44" fill="#15191b" font-size="22" font-weight="700">Prototype workshop</text><text x="24" y="78" fill="#6f8a7a" font-size="16" font-weight="700">Learn before scaling</text><text x="24" y="126" fill="#56605b" font-size="16">Shared or leased space</text><text x="24" y="160" fill="#56605b" font-size="16">Flexible benches and tools</text><text x="24" y="194" fill="#56605b" font-size="16">Outside fabrication</text><text x="24" y="228" fill="#56605b" font-size="16">Engineering builds</text><line x1="24" y1="264" x2="236" y2="264" stroke="#c7d2cb"/><text x="24" y="304" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="24" y="336" fill="#56605b" font-size="15">Design and demand still move</text><text x="24" y="380" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="24" y="412" fill="#56605b" font-size="15">Informal process becomes habit</text></g>
    <g transform="translate(332 154)"><rect width="260" height="428" rx="22" fill="#dfe8e2"/><text x="24" y="44" fill="#15191b" font-size="22" font-weight="700">Minimum viable factory</text><text x="24" y="78" fill="#56605b" font-size="16" font-weight="700">Control the critical steps</text><text x="24" y="126" fill="#56605b" font-size="16">Dedicated light industrial bay</text><text x="24" y="160" fill="#56605b" font-size="16">Manual and assisted assembly</text><text x="24" y="194" fill="#56605b" font-size="16">Owned test and genealogy</text><text x="24" y="228" fill="#56605b" font-size="16">Selective fixtures</text><line x1="24" y1="264" x2="236" y2="264" stroke="#91a79a"/><text x="24" y="304" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="24" y="336" fill="#56605b" font-size="15">Early commercial volume matters</text><text x="24" y="380" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="24" y="412" fill="#56605b" font-size="15">Too little support capacity</text></g>
    <g transform="translate(610 154)"><rect width="260" height="428" rx="22" fill="#91a79a"/><text x="24" y="44" fill="#15191b" font-size="22" font-weight="700">Conventional small plant</text><text x="24" y="78" fill="#26312d" font-size="16" font-weight="700">Repeat with discipline</text><text x="24" y="126" fill="#26312d" font-size="16">Defined areas and routes</text><text x="24" y="160" fill="#26312d" font-size="16">Dedicated equipment</text><text x="24" y="194" fill="#26312d" font-size="16">Production supervision</text><text x="24" y="228" fill="#26312d" font-size="16">Quality and maintenance system</text><line x1="24" y1="264" x2="236" y2="264" stroke="#52675c"/><text x="24" y="304" fill="#15191b" font-size="16" font-weight="700">Best when</text><text x="24" y="336" fill="#26312d" font-size="15">Demand and process are stable</text><text x="24" y="380" fill="#15191b" font-size="16" font-weight="700">Main risk</text><text x="24" y="412" fill="#26312d" font-size="15">Fixed cost outruns orders</text></g>
    <g transform="translate(888 154)"><rect width="260" height="428" rx="22" fill="#26312d" stroke="#91a79a" stroke-width="2"/><text x="24" y="44" fill="#f6f2e8" font-size="22" font-weight="700">Selective smart factory</text><text x="24" y="78" fill="#91a79a" font-size="16" font-weight="700">Adapt where value is proven</text><text x="24" y="126" fill="#b9c8bf" font-size="16">Connected production records</text><text x="24" y="160" fill="#b9c8bf" font-size="16">Vision and guided work</text><text x="24" y="194" fill="#b9c8bf" font-size="16">Bounded adaptive cells</text><text x="24" y="228" fill="#b9c8bf" font-size="16">Measured reuse</text><line x1="24" y1="264" x2="236" y2="264" stroke="#6f8a7a"/><text x="24" y="304" fill="#f6f2e8" font-size="16" font-weight="700">Best when</text><text x="24" y="336" fill="#b9c8bf" font-size="15">Variation has a proven cost</text><text x="24" y="380" fill="#f6f2e8" font-size="16" font-weight="700">Main risk</text><text x="24" y="412" fill="#b9c8bf" font-size="15">Integration without payoff</text></g>
  </g>
  <rect x="64" y="616" width="1072" height="46" rx="20" fill="#b16f50"/><text x="600" y="646" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Move right only when product stability, demand, process evidence, people, and cash can support the next operating model.</text>
</svg>
