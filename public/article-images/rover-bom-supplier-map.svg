<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The bill connects product configuration with supplier evidence</title>
  <desc id="desc">Diagram showing product requirements flowing through a controlled bill of materials to representative supplier categories and acceptance evidence.</desc>
  <rect width="1600" height="1000" fill="#f4f0e8"/>
  <rect x="50" y="50" width="1500" height="900" rx="34" fill="#fffdfa" stroke="#d9d4c9" stroke-width="2"/>
  <text x="100" y="125" fill="#18201d" font-family="Georgia, serif" font-size="48" font-weight="700">The bill connects configuration with supplier evidence</text>
  <text x="100" y="170" fill="#667069" font-family="Arial, sans-serif" font-size="23">A useful row controls the item, its source, its risk, and the proof required at receipt</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="230" width="335" height="570" rx="26" fill="#edf2ec" stroke="#cdd7cb"/>
    <text x="135" y="280" fill="#18201d" font-size="25" font-weight="700">Released product data</text>
    <g fill="#fffdfa" stroke="#d9dfd5">
      <rect x="135" y="315" width="265" height="62" rx="12"/><rect x="135" y="395" width="265" height="62" rx="12"/><rect x="135" y="475" width="265" height="62" rx="12"/><rect x="135" y="555" width="265" height="62" rx="12"/><rect x="135" y="635" width="265" height="62" rx="12"/><rect x="135" y="715" width="265" height="62" rx="12"/>
    </g>
    <g fill="#34413b" font-size="20"><text x="160" y="354">Part number and revision</text><text x="160" y="434">Description and quantity</text><text x="160" y="514">Approved manufacturer</text><text x="160" y="594">Lifecycle and lead time</text><text x="160" y="674">Inspection requirement</text><text x="160" y="754">Change effectivity</text></g>

    <path d="M455 515 H555" stroke="#8c9c8a" stroke-width="5"/><polygon points="555,515 532,501 532,529" fill="#8c9c8a"/>
    <rect x="575" y="230" width="450" height="570" rx="28" fill="#1a211e"/>
    <text x="800" y="285" text-anchor="middle" fill="#f8f6f0" font-size="26" font-weight="700">Manufacturing bill of materials</text>
    <text x="800" y="320" text-anchor="middle" fill="#bcc8bf" font-size="19">One controlled source of product identity</text>
    <g font-size="19">
      <g><rect x="620" y="365" width="360" height="66" rx="13" fill="#303b36"/><text x="650" y="406" fill="#f7f4ed">Structure and fabricated parts</text></g>
      <g><rect x="620" y="449" width="360" height="66" rx="13" fill="#303b36"/><text x="650" y="490" fill="#f7f4ed">Motion and power components</text></g>
      <g><rect x="620" y="533" width="360" height="66" rx="13" fill="#303b36"/><text x="650" y="574" fill="#f7f4ed">Boards, compute, and sensors</text></g>
      <g><rect x="620" y="617" width="360" height="66" rx="13" fill="#303b36"/><text x="650" y="658" fill="#f7f4ed">Harnesses, fasteners, and labels</text></g>
      <g><rect x="620" y="701" width="360" height="66" rx="13" fill="#d6a56f"/><text x="650" y="742" fill="#18201d" font-weight="700">Packaging and shipment items</text></g>
    </g>

    <path d="M1045 515 H1145" stroke="#c58f5f" stroke-width="5"/><polygon points="1145,515 1122,501 1122,529" fill="#c58f5f"/>
    <rect x="1165" y="230" width="335" height="570" rx="26" fill="#f2e8dc" stroke="#dec7ad"/>
    <text x="1200" y="280" fill="#18201d" font-size="25" font-weight="700">Supplier evidence</text>
    <g fill="#fffdfa" stroke="#e4d4c2">
      <rect x="1200" y="315" width="265" height="62" rx="12"/><rect x="1200" y="395" width="265" height="62" rx="12"/><rect x="1200" y="475" width="265" height="62" rx="12"/><rect x="1200" y="555" width="265" height="62" rx="12"/><rect x="1200" y="635" width="265" height="62" rx="12"/><rect x="1200" y="715" width="265" height="62" rx="12"/>
    </g>
    <g fill="#34413b" font-size="20"><text x="1225" y="354">Exact delivered identity</text><text x="1225" y="434">Authorized source and lot</text><text x="1225" y="514">Certificate or test result</text><text x="1225" y="594">Dimensional or visual check</text><text x="1225" y="674">Functional screen</text><text x="1225" y="754">Accept or quarantine status</text></g>

    <rect x="100" y="850" width="1400" height="55" rx="13" fill="#18201d"/>
    <text x="125" y="884" fill="#f6f4ef" font-size="18">REPRESENTATIVE SOURCES ONLY  |  Catalog examples include Raspberry Pi, Luxonis, and Maxon  |  No claimed rover supplier relationships</text>
  </g>
</svg>
