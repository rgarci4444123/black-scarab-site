<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">The production route changes with volume</title>
  <desc id="desc">Mobile comparison of routes for ten prototypes, one hundred units, and annual capacity for one thousand units.</desc>
  <rect width="900" height="1400" fill="#f4f0e8"/>
  <rect x="35" y="35" width="830" height="1330" rx="30" fill="#fffdfa" stroke="#d9d4c9"/>
  <text x="80" y="105" fill="#18201d" font-family="Georgia, serif" font-size="40" font-weight="700">The route changes</text><text x="80" y="152" fill="#18201d" font-family="Georgia, serif" font-size="40" font-weight="700">with volume</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="215" width="740" height="300" rx="24" fill="#edf2ec"/>
    <text x="115" y="268" fill="#18201d" font-size="28" font-weight="700">10 prototypes</text><text x="115" y="305" fill="#667069" font-size="20">Flexible project route</text>
    <text x="115" y="360" fill="#34413b" font-size="20">Build and modify</text><text x="470" y="360" fill="#34413b" font-size="20">Debug interfaces</text>
    <text x="115" y="405" fill="#34413b" font-size="20">Record every failure</text><text x="470" y="405" fill="#34413b" font-size="20">Correct the definition</text>
    <text x="115" y="470" fill="#5c6e60" font-size="18" font-weight="700">PRIMARY OUTPUT  |  KNOWLEDGE</text>
    <path d="M450 515 V565" stroke="#8c9c8a" stroke-width="5"/><polygon points="450,565 436,542 464,542" fill="#8c9c8a"/>
    <rect x="80" y="585" width="740" height="300" rx="24" fill="#f2e8dc"/>
    <text x="115" y="638" fill="#18201d" font-size="28" font-weight="700">100 commercial units</text><text x="115" y="675" fill="#667069" font-size="20">Controlled pilot cell</text>
    <text x="115" y="730" fill="#34413b" font-size="20">Release small batches</text><text x="470" y="730" fill="#34413b" font-size="20">Train repeatable work</text>
    <text x="115" y="775" fill="#34413b" font-size="20">Capture quality data</text><text x="470" y="775" fill="#34413b" font-size="20">Control every change</text>
    <text x="115" y="840" fill="#8a603d" font-size="18" font-weight="700">PRIMARY OUTPUT  |  REPEATABILITY</text>
    <path d="M450 885 V935" stroke="#c58f5f" stroke-width="5"/><polygon points="450,935 436,912 464,912" fill="#c58f5f"/>
    <rect x="80" y="955" width="740" height="300" rx="24" fill="#1a211e"/>
    <text x="115" y="1008" fill="#f8f6f0" font-size="28" font-weight="700">1,000 unit capacity</text><text x="115" y="1045" fill="#bcc8bf" font-size="20">Balanced parallel stations</text>
    <text x="115" y="1100" fill="#f7f4ed" font-size="20">105 minutes of takt</text><text x="470" y="1100" fill="#f7f4ed" font-size="20">515 minutes of direct work</text>
    <text x="115" y="1145" fill="#f7f4ed" font-size="20">Longest station 100 minutes</text><text x="470" y="1145" fill="#f7f4ed" font-size="20">Reserve absorbs losses</text>
    <text x="115" y="1210" fill="#d6a56f" font-size="18" font-weight="700">PRIMARY OUTPUT  |  CAPACITY</text>
    <rect x="80" y="1290" width="740" height="45" rx="11" fill="#18201d"/>
    <text x="450" y="1319" text-anchor="middle" fill="#f6f4ef" font-size="15">ILLUSTRATIVE PLANNING ASSUMPTIONS</text>
  </g>
</svg>
