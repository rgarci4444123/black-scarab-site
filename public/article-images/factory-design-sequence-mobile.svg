<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1700" viewBox="0 0 900 1700" role="img" aria-labelledby="title desc">
  <title id="title">Factory design sequence</title>
  <desc id="desc">Nine stages move from product definition to a verified and expandable factory plan.</desc>
  <rect width="900" height="1700" fill="#f5f0e6"/>
  <text x="70" y="85" fill="#1d2420" font-family="Arial, sans-serif" font-size="42" font-weight="700">Design the production</text><text x="70" y="135" fill="#1d2420" font-family="Arial, sans-serif" font-size="42" font-weight="700">system first</text>
  <text x="70" y="180" fill="#69716b" font-family="Arial, sans-serif" font-size="22">Nine evidence gates shape the factory</text>
  <path d="M120 255 V1530" stroke="#a8b2aa" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 225)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Product</text><text x="130" y="84" fill="#5f6862" font-size="20">Variants, acceptance, quality, and change</text></g>
    <g transform="translate(80 375)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Demand</text><text x="130" y="84" fill="#5f6862" font-size="20">Volume, mix, calendar, and uncertainty</text></g>
    <g transform="translate(80 525)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Route</text><text x="130" y="84" fill="#5f6862" font-size="20">Operations, quality, rework, and sourcing</text></g>
    <g transform="translate(80 675)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Capacity</text><text x="130" y="84" fill="#5f6862" font-size="20">People, equipment, buffers, and constraints</text></g>
    <g transform="translate(80 825)"><circle cx="40" cy="40" r="30" fill="#d5b47a"/><text x="40" y="49" text-anchor="middle" fill="#1d2420" font-size="24" font-weight="700">5</text><rect x="95" width="700" height="125" rx="22" fill="#34413b"/><text x="130" y="48" fill="#fffdf7" font-size="27" font-weight="700">Flow and layout</text><text x="130" y="84" fill="#dce4de" font-size="20">Relationships, routes, storage, and support</text></g>
    <g transform="translate(80 975)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">6</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Utilities</text><text x="130" y="84" fill="#5f6862" font-size="20">Loads, quality, isolation, and growth</text></g>
    <g transform="translate(80 1125)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">7</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Site</text><text x="130" y="84" fill="#5f6862" font-size="20">Building, permits, resilience, and economics</text></g>
    <g transform="translate(80 1275)"><circle cx="40" cy="40" r="30" fill="#34413b"/><text x="40" y="49" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">8</text><rect x="95" width="700" height="125" rx="22" fill="#fffdf7" stroke="#65766d" stroke-width="3"/><text x="130" y="48" fill="#1d2420" font-size="27" font-weight="700">Validation</text><text x="130" y="84" fill="#5f6862" font-size="20">Safety, simulation, access, and operations</text></g>
    <g transform="translate(80 1425)"><circle cx="40" cy="40" r="30" fill="#f5f0e6" stroke="#7f9589" stroke-width="4"/><text x="40" y="49" text-anchor="middle" fill="#1d2420" font-size="24" font-weight="700">9</text><rect x="95" width="700" height="125" rx="22" fill="#7f9589"/><text x="130" y="48" fill="#fff" font-size="27" font-weight="700">Phases</text><text x="130" y="84" fill="#f2f5f3" font-size="20">Launch, triggers, interfaces, and change control</text></g>
  </g>
</svg>
