name: Virtual events discovery and review
on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '0 9 * * 2'
      timezone: America/New_York
    - cron: '0 10 * * 2,5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [daily, broad, review, approve, reject]
        default: daily
        description: Scan, prepare a review batch, or review one event
      event_id:
        description: Event ID from the review batch (for approve/reject)
      summary:
        description: One short factual description, 12 to 24 words (optional edit)
      display_title:
        description: Optional display title edit
      override_reason:
        description: Editorial justification when approving a score below 65
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: virtual-events-editorial-state
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVIEW_BRANCH: codex/virtual-events-review
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIRTUAL_EVENTS_OPENAI_MODEL: ${{ vars.VIRTUAL_EVENTS_OPENAI_MODEL }}
      EVENT_ID: ${{ inputs.event_id }}
      EVENT_SUMMARY: ${{ inputs.summary }}
      EVENT_DISPLAY_TITLE: ${{ inputs.display_title }}
      EVENT_OVERRIDE_REASON: ${{ inputs.override_reason }}
      EVENT_REVIEWER: ${{ github.actor }}
      INPUT_OPERATION: ${{ inputs.operation }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Continue the existing review branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$REVIEW_BRANCH" >/dev/null; then
            git checkout -B "$REVIEW_BRANCH" "origin/$REVIEW_BRANCH"
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git checkout -b "$REVIEW_BRANCH"
          fi
      - name: Discover or apply an editorial decision
        id: operation
        shell: bash
        run: |
          operation="$INPUT_OPERATION"
          if [ -z "$operation" ]; then
            case "$SCHEDULE" in
              '0 9 * * 2') operation=broad ;;
              '0 10 * * 2,5') operation=review ;;
              *) operation=daily ;;
            esac
          fi
          node scripts/virtual-events.mjs "$operation"
      - name: Test the event workflow
        if: always()
        run: npm run test:virtual-events
      - name: Validate the event records
        if: always()
        run: npm run validate:virtual-events
      - name: Save evidence and update the review pull request
        if: always() && !cancelled()
        shell: bash
        run: |
          git add data/virtual-events docs/virtual-events
          if ! git diff --cached --quiet; then
            git commit -m 'Update virtual events discovery and editorial queue'
            git push origin "$REVIEW_BRANCH"
          fi
          if ! git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- data/virtual-events docs/virtual-events; then
            if ! gh pr list --head "$REVIEW_BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
              gh pr create --base "$DEFAULT_BRANCH" --head "$REVIEW_BRANCH" --title 'Review upcoming virtual events' --body-file docs/virtual-events/pull-request.md
            fi
          fi
      - name: Retain scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-events-scan-${{ github.run_id }}
          path: |
            data/virtual-events/scan-status.json
            docs/virtual-events/review-batch.md
          if-no-files-found: ignore
