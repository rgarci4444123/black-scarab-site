<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540"><rect width="1200" height="1540" fill="#FFFFFF"/><text x="68" y="72" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#5A7164" font-weight="600">BLACK SCARAB   /   RESEARCH</text><text x="68" y="157" font-family="Georgia, Times New Roman" font-size="63" fill="#15191B" font-weight="600">Utilization changes the return</text><text x="68" y="216" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" fill="#56605A" font-weight="400">Two outcomes for a fictional warehouse operator</text><path d="M68 255H1132" stroke="#CCD6CF" stroke-width="2"/><rect x="68" y="290" width="1064" height="163" rx="14" fill="#EDF2EF"/><text x="98" y="349" font-family="Helvetica Neue, Helvetica, Arial" font-size="31" fill="#5A7164" font-weight="600">HYPOTHETICAL MODEL</text><text x="98" y="411" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" fill="#15191B" font-weight="400">Not Plus One pricing or measured performance.</text><text x="68" y="528" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" fill="#15191B" font-weight="600">Same assumed installed investment: $220,000</text><text x="68" y="588" font-family="Helvetica Neue, Helvetica, Arial" font-size="40" fill="#15191B" font-weight="400">Same assumed recurring cost: $38,000 per year</text><rect x="68" y="680" width="506" height="506" rx="14" fill="#EDF2EF"/><rect x="598" y="680" width="534" height="506" rx="14" fill="#F6F7F6"/><text x="98" y="743" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#5A7164" font-weight="600">EXPECTED CASE</text><text x="628" y="743" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#5A7164" font-weight="600">LOWER VALUE CASE</text><text x="98" y="830" font-family="Helvetica Neue, Helvetica, Arial" font-size="62" fill="#15191B" font-weight="600">$125,000</text><text x="628" y="830" font-family="Helvetica Neue, Helvetica, Arial" font-size="62" fill="#15191B" font-weight="600">$80,000</text><text x="98" y="881" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" fill="#15191B" font-weight="400">gross value per year</text><text x="628" y="881" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" fill="#15191B" font-weight="400">gross value per year</text><text x="98" y="982" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" fill="#34483C" font-weight="600">$87,000 net</text><text x="628" y="982" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" fill="#34483C" font-weight="600">$42,000 net</text><text x="98" y="1084" font-family="Helvetica Neue, Helvetica, Arial" font-size="58" fill="#15191B" font-weight="600">2.53 years</text><text x="628" y="1084" font-family="Helvetica Neue, Helvetica, Arial" font-size="58" fill="#15191B" font-weight="600">5.24 years</text><text x="98" y="1144" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#15191B" font-weight="400">Simple payback</text><text x="628" y="1144" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#15191B" font-weight="400">Simple payback</text><text x="68" y="1300" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#34483C" font-weight="400">Net benefit = gross operating value less recurring cost.</text><text x="68" y="1345.9" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#34483C" font-weight="400">Simple payback = installed investment divided by net benefit.</text><path d="M68 1400H1132" stroke="#CCD6CF" stroke-width="2"/><text x="68" y="1446" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Black Scarab illustration. All inputs are hypothetical.</text><text x="68" y="1485.15" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Excludes finance, tax, discounting, ramp, and residual value.</text></svg>