<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530"><rect width="1200" height="1530" fill="#FFFFFF"/><text x="68" y="72" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#5A7164" font-weight="600">BLACK SCARAB   /   RESEARCH</text><text x="68" y="157" font-family="Georgia, Times New Roman" font-size="63" fill="#15191B" font-weight="600">From parcel to accepted work</text><text x="68" y="216" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" fill="#56605A" font-weight="400">A functional view of the induction workflow</text><path d="M68 255H1132" stroke="#CCD6CF" stroke-width="2"/><rect x="68" y="300" width="1064" height="206" rx="14" fill="#EDF2EF"/><text x="98" y="367" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" fill="#6F8A7A" font-weight="600">01</text><text x="195" y="366" font-family="Helvetica Neue, Helvetica, Arial" font-size="47" fill="#15191B" font-weight="600">Present</text><text x="195" y="422" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">Mixed parcels enter</text><text x="195" y="474.65" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">a usable pick area.</text><path d="M600 510v29m-9-10 9 10 9-10" fill="none" stroke="#6F8A7A" stroke-width="3"/><rect x="68" y="545" width="1064" height="206" rx="14" fill="#EDF2EF"/><text x="98" y="612" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" fill="#6F8A7A" font-weight="600">02</text><text x="195" y="611" font-family="Helvetica Neue, Helvetica, Arial" font-size="47" fill="#15191B" font-weight="600">Perceive</text><text x="195" y="667" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">Images and depth support</text><text x="195" y="719.65" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">candidate selection.</text><path d="M600 755v29m-9-10 9 10 9-10" fill="none" stroke="#6F8A7A" stroke-width="3"/><rect x="68" y="790" width="1064" height="206" rx="14" fill="#EDF2EF"/><text x="98" y="857" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" fill="#6F8A7A" font-weight="600">03</text><text x="195" y="856" font-family="Helvetica Neue, Helvetica, Arial" font-size="47" fill="#15191B" font-weight="600">Move</text><text x="195" y="912" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">The controller and gripper</text><text x="195" y="964.65" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">execute the requested pick.</text><path d="M600 1000v29m-9-10 9 10 9-10" fill="none" stroke="#6F8A7A" stroke-width="3"/><rect x="68" y="1035" width="1064" height="206" rx="14" fill="#EDF2EF"/><text x="98" y="1102" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" fill="#6F8A7A" font-weight="600">04</text><text x="195" y="1101" font-family="Helvetica Neue, Helvetica, Arial" font-size="47" fill="#15191B" font-weight="600">Verify</text><text x="195" y="1157" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">Confirm placement and</text><text x="195" y="1209.65" font-family="Helvetica Neue, Helvetica, Arial" font-size="39" fill="#15191B" font-weight="400">accepted downstream work.</text><text x="68" y="1320" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" fill="#34483C" font-weight="500">Measure accepted output across the complete cell.</text><path d="M68 1390H1132" stroke="#CCD6CF" stroke-width="2"/><text x="68" y="1436" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Black Scarab interpretation of Plus One materials.</text><text x="68" y="1475.15" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Not a proprietary diagram or certified safety architecture.</text><