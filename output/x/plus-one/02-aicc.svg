<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650"><rect width="1200" height="1650" fill="#FFFFFF"/><text x="68" y="72" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#5A7164" font-weight="600">BLACK SCARAB   /   RESEARCH</text><text x="68" y="157" font-family="Georgia, Times New Roman" font-size="63" fill="#15191B" font-weight="600">The AI Crew Chief result</text><text x="68" y="216" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" fill="#56605A" font-weight="400">A useful experiment that did not clear the human bar</text><path d="M68 255H1132" stroke="#CCD6CF" stroke-width="2"/><rect x="68" y="295" width="1064" height="155" rx="14" fill="#EDF2EF"/><text x="98" y="350" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#5A7164" font-weight="600">PRODUCTION EXAMPLES</text><text x="98" y="412" font-family="Helvetica Neue, Helvetica, Arial" font-size="45" fill="#15191B" font-weight="600">6,000 Crew Chief responses</text><rect x="68" y="505" width="1064" height="170" rx="14" fill="#F5F7F5"/><text x="98" y="553" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" fill="#5A7164" font-weight="600">Exact selection similarity</text><text x="98" y="617" font-family="Helvetica Neue, Helvetica, Arial" font-size="50" fill="#15191B" font-weight="600">Below 30%</text><text x="470" y="610" font-family="Helvetica Neue, Helvetica, Arial" font-size="33" fill="#56605A" font-weight="400">AI often chose a different parcel</text><rect x="68" y="710" width="1064" height="170" rx="14" fill="#F5F7F5"/><text x="98" y="758" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" fill="#5A7164" font-weight="600">Human judged acceptability</text><text x="98" y="822" font-family="Helvetica Neue, Helvetica, Arial" font-size="50" fill="#15191B" font-weight="600">80%</text><text x="470" y="815" font-family="Helvetica Neue, Helvetica, Arial" font-size="33" fill="#56605A" font-weight="400">Different can still be workable</text><rect x="68" y="915" width="1064" height="170" rx="14" fill="#E4ECE7"/><text x="98" y="963" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" fill="#5A7164" font-weight="600">Human first pass success</text><text x="98" y="1027" font-family="Helvetica Neue, Helvetica, Arial" font-size="50" fill="#15191B" font-weight="600">Above 95%</text><text x="470" y="1020" font-family="Helvetica Neue, Helvetica, Arial" font-size="33" fill="#56605A" font-weight="400">Humans remained the benchmark</text><rect x="68" y="1120" width="1064" height="170" rx="14" fill="#F5F7F5"/><text x="98" y="1168" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" fill="#5A7164" font-weight="600">Mean model timing</text><text x="98" y="1232" font-family="Helvetica Neue, Helvetica, Arial" font-size="50" fill="#15191B" font-weight="600">3 to 7 sec</text><text x="470" y="1225" font-family="Helvetica Neue, Helvetica, Arial" font-size="33" fill="#56605A" font-weight="400">Maximum reported up to 22 sec</text><text x="68" y="1390" font-family="Helvetica Neue, Helvetica, Arial" font-size="35" fill="#34483C" font-weight="600">Decision: do not operate independently.</text><text x="68" y="1437.25" font-family="Helvetica Neue, Helvetica, Arial" font-size="35" fill="#34483C" font-weight="600">Explore AI as a prelabeler for human supervisors.</text><path d="M68 1510H1132" stroke="#CCD6CF" stroke-width="2"/><text x="68" y="1556" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Source: Plus One Robotics AICC experiment, 2026.</text><text x="68" y="1595.15" font-family="Helvetica Neue, Helvetica, Arial" font-size="29" fill="#56605A" font-weight="400">Company reported results. Black Scarab did not reproduce the test.</text></svg>